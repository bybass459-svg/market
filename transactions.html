<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orders - MarketStall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="supabase.js"></script>
    <style>
        /* Same styles as before */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f5f7fa; color: #0b1b2b; padding-bottom: 70px; }
        a { text-decoration: none; color: inherit; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 380px; width: 90%; pointer-events: none; }
        .toast { background: #ffffff; border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); border-left: 4px solid #2a7de1; display: flex; align-items: center; gap: 12px; transform: translateX(120%); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: auto; position: relative; overflow: hidden; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.hide { transform: translateX(120%); opacity: 0; }
        .toast-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
        .toast-success .toast-icon { background: #d4edda; color: #155724; }
        .toast-error .toast-icon { background: #f8d7da; color: #721c24; }
        .toast-warning .toast-icon { background: #fff3cd; color: #856404; }
        .toast-info .toast-icon { background: #d1ecf1; color: #0c5460; }
        .toast-success { border-left-color: #28a745; }
        .toast-error { border-left-color: #dc3545; }
        .toast-warning { border-left-color: #ffc107; }
        .toast-info { border-left-color: #17a2b8; }
        .toast-content { flex: 1; }
        .toast-content .toast-title { font-weight: 600; font-size: 0.9rem; color: #0b1b2b; }
        .toast-content .toast-message { font-size: 0.82rem; color: #5b768b; }
        .toast-close { background: none; border: none; color: #999; cursor: pointer; font-size: 1.1rem; padding: 0 4px; }
        .toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; animation: toastProgress 4s linear forwards; }
        .toast-success .toast-progress { background: #28a745; }
        .toast-error .toast-progress { background: #dc3545; }
        .toast-warning .toast-progress { background: #ffc107; }
        .toast-info .toast-progress { background: #17a2b8; }
        @keyframes toastProgress { 0% { width: 100%; } 100% { width: 0%; } }

        .header { position: sticky; top: 0; z-index: 100; background: #ffffff; padding: 12px 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border-bottom: 1px solid #eef2f6; }
        .header-top { display: flex; align-items: center; gap: 12px; max-width: 1280px; margin: 0 auto; }
        .logo { font-size: 1.3rem; font-weight: 700; color: #0b1b2b; flex-shrink: 0; }
        .logo i { color: #f8b400; }
        .logo span { color: #2a7de1; }
        .search-bar { flex: 1; display: flex; background: #f1f4f8; border-radius: 30px; overflow: hidden; height: 40px; max-width: 500px; }
        .search-bar input { flex: 1; border: none; background: transparent; padding: 0 16px; font-size: 0.85rem; outline: none; }
        .search-bar button { border: none; background: #f8b400; color: #0b1b2b; padding: 0 18px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
        .search-bar button:hover { background: #e0a000; }

        .profile-menu { position: relative; display: inline-block; }
        .profile-btn { background: #f1f4f8; border: none; border-radius: 30px; padding: 6px 14px 6px 10px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; font-weight: 500; color: #1f3a4b; }
        .profile-btn:hover { background: #e3eaf2; }
        .profile-btn i { font-size: 1rem; color: #2a7de1; }
        .profile-btn .avatar-small { width: 28px; height: 28px; border-radius: 50%; background: #2a7de1; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 600; }
        .profile-btn .chevron { font-size: 0.6rem; color: #868e96; margin-left: 2px; }

        .profile-dropdown { display: none; position: absolute; right: 0; top: 44px; background: #ffffff; min-width: 200px; border-radius: 12px; border: 1px solid #eef2f6; box-shadow: 0 8px 32px rgba(0,0,0,0.1); z-index: 200; padding: 6px 0; overflow: hidden; }
        .profile-dropdown.show { display: block; }
        .profile-dropdown .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: #1f3a4b; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: 0.2s; text-decoration: none; border: none; background: none; width: 100%; text-align: left; }
        .profile-dropdown .dropdown-item:hover { background: #f1f4f8; }
        .profile-dropdown .dropdown-item i { width: 20px; color: #5b768b; font-size: 0.95rem; }
        .profile-dropdown .dropdown-divider { height: 1px; background: #eef2f6; margin: 4px 12px; }
        .profile-dropdown .dropdown-item.logout { color: #dc3545; }
        .profile-dropdown .dropdown-item.logout i { color: #dc3545; }
        .profile-dropdown .dropdown-item .badge { background: #dc3545; color: #fff; border-radius: 50%; font-size: 0.6rem; padding: 1px 6px; margin-left: auto; }
        .profile-dropdown .user-info { padding: 12px 16px 8px; border-bottom: 1px solid #eef2f6; }
        .profile-dropdown .user-info .name { font-weight: 600; font-size: 0.9rem; }
        .profile-dropdown .user-info .email { font-size: 0.75rem; color: #5b768b; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; display: flex; justify-content: space-around; align-items: center; padding: 6px 0 10px; box-shadow: 0 -2px 16px rgba(0,0,0,0.06); border-top: 1px solid #eef2f6; z-index: 999; height: 64px; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; color: #868e96; font-size: 0.6rem; font-weight: 500; transition: 0.2s; padding: 2px 8px; position: relative; min-width: 50px; }
        .bottom-nav a i { font-size: 1.2rem; margin-bottom: 2px; }
        .bottom-nav a:hover { color: #f8b400; }
        .bottom-nav a.active { color: #f8b400; }
        .bottom-nav a .nav-badge { position: absolute; top: -4px; right: 2px; background: #dc3545; color: #fff; border-radius: 50%; font-size: 0.5rem; font-weight: 700; padding: 1px 5px; min-width: 16px; text-align: center; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 12px; flex-wrap: wrap; gap: 8px; }
        .page-header h1 { font-size: 1.2rem; font-weight: 700; }
        .page-header h1 i { color: #f8b400; margin-right: 6px; }
        .page-header .order-count { font-size: 0.8rem; color: #5b768b; background: #f1f4f8; padding: 4px 14px; border-radius: 30px; }

        .filter-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .filter-tabs button { padding: 6px 16px; border-radius: 30px; border: 1px solid #eef2f6; background: #ffffff; font-weight: 500; font-size: 0.75rem; color: #1f3a4b; cursor: pointer; transition: 0.2s; white-space: nowrap; flex-shrink: 0; }
        .filter-tabs button:hover { background: #f1f4f8; }
        .filter-tabs button.active { background: #f8b400; color: #0b1b2b; border-color: #f8b400; }

        .order-card { background: #ffffff; border-radius: 12px; border: 1px solid #eef2f6; padding: 16px; margin-bottom: 12px; transition: 0.2s; }
        .order-card:hover { border-color: #f8b400; }
        .order-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid #eef2f6; }
        .order-header .order-id { font-weight: 700; font-size: 0.9rem; }
        .order-header .order-id i { color: #f8b400; margin-right: 4px; }
        .order-header .order-date { color: #5b768b; font-size: 0.8rem; }
        .order-header .order-status { padding: 2px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; }
        .status-processing { background: #fef3e6; color: #a8641a; }
        .status-shipped { background: #e6f0fa; color: #1f5680; }
        .status-delivered { background: #e6f3e6; color: #0f5c3a; }
        .status-cancelled { background: #fde8e8; color: #dc3545; }

        .order-items { padding: 8px 0; }
        .order-item { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 2px 0; }
        .order-item .item-name { display: flex; align-items: center; gap: 6px; }
        .order-item .item-name i { color: #2a7de1; width: 18px; }

        .order-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding-top: 10px; border-top: 1px solid #eef2f6; }
        .order-footer .total { font-weight: 700; font-size: 0.95rem; }
        .order-footer .total span { color: #2a7de1; }
        .order-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .order-actions button { padding: 4px 14px; border-radius: 30px; border: 1px solid #eef2f6; background: #f8f9fa; font-weight: 500; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
        .order-actions button:hover { background: #f1f4f8; }
        .order-actions .track-btn { background: #2a7de1; color: #fff; border-color: #2a7de1; }
        .order-actions .track-btn:hover { background: #1a5fb0; }
        .order-actions .reorder-btn { background: #f8b400; color: #0b1b2b; border-color: #f8b400; }
        .order-actions .reorder-btn:hover { background: #e0a000; }
        .order-actions .cancel-btn { background: transparent; color: #dc3545; border-color: #dc3545; }
        .order-actions .cancel-btn:hover { background: #dc3545; color: #fff; }

        .empty-state { text-align: center; padding: 40px 20px; background: #ffffff; border-radius: 12px; border: 1px solid #eef2f6; }
        .empty-state i { font-size: 3rem; color: #dce5ed; margin-bottom: 12px; display: block; }
        .empty-state h3 { font-size: 1rem; margin-bottom: 4px; }
        .empty-state p { color: #5b768b; font-size: 0.85rem; margin-bottom: 12px; }
        .btn-shop { display: inline-block; padding: 8px 24px; border-radius: 30px; font-weight: 600; font-size: 0.85rem; background: #2a7de1; color: #fff; transition: 0.2s; }
        .btn-shop:hover { background: #1a5fb0; transform: translateY(-2px); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #ffffff; border-radius: 16px; padding: 24px; max-width: 480px; width: 100%; max-height: 80vh; overflow-y: auto; position: relative; }
        .modal-content .close-modal { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #5b768b; }
        .modal-content h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; }
        .tracking-step { display: flex; gap: 12px; padding: 8px 0; padding-left: 24px; position: relative; }
        .tracking-step::before { content: ''; position: absolute; left: 8px; top: 24px; bottom: 0; width: 2px; background: #eef2f6; }
        .tracking-step:last-child::before { display: none; }
        .tracking-step .step-dot { position: absolute; left: 2px; top: 12px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #dce5ed; background: #fff; z-index: 1; }
        .tracking-step .step-dot.active { border-color: #28a745; background: #28a745; }
        .tracking-step .step-dot.current { border-color: #f8b400; background: #f8b400; box-shadow: 0 0 0 4px rgba(248,180,0,0.2); }
        .tracking-step .step-content h4 { font-size: 0.85rem; font-weight: 600; }
        .tracking-step .step-content p { font-size: 0.75rem; color: #5b768b; }

        .footer { background: #ffffff; border-radius: 12px; padding: 16px; margin: 8px 0 10px; border: 1px solid #eef2f6; text-align: center; }
        .footer .logo { font-size: 1rem; }
        .footer p { font-size: 0.65rem; color: #5b768b; margin-top: 4px; }
        .loading-spinner { display: flex; justify-content: center; align-items: center; padding: 40px 0; }
        .loading-spinner i { font-size: 2rem; color: #f8b400; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (min-width: 640px) {
            body { padding-bottom: 0; }
            .bottom-nav { display: none; }
            .header { padding: 12px 24px; }
            .logo { font-size: 1.5rem; }
            .search-bar { height: 44px; }
            .search-bar input { font-size: 0.95rem; padding: 0 20px; }
            .search-bar button { padding: 0 24px; font-size: 0.95rem; }
            .page-header h1 { font-size: 1.4rem; }
            .order-card { padding: 20px; }
        }
        @media (min-width: 1024px) {
            .container { padding: 0 24px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-top">
            <a href="index.html" class="logo"><i class="fas fa-store-alt"></i> Market<span>Stall</span></a>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search products...">
                <button onclick="searchProducts()"><i class="fas fa-search"></i></button>
            </div>
            <div class="profile-menu">
                <button class="profile-btn" onclick="toggleProfileMenu()">
                    <span class="avatar-small" id="avatarLetter">U</span>
                    <span id="profileName">Account</span>
                    <i class="fas fa-chevron-down chevron"></i>
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="user-info"><div class="name" id="dropdownName">User</div><div class="email" id="dropdownEmail">user@example.com</div></div>
                    <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i> My Profile</a>
                    <a href="wishlist.html" class="dropdown-item"><i class="fas fa-heart"></i> Wishlist</a>
                    <a href="cart.html" class="dropdown-item"><i class="fas fa-shopping-cart"></i> Cart <span class="badge" id="dropdownCartBadge">0</span></a>
                    <a href="transactions.html" class="dropdown-item"><i class="fas fa-receipt"></i> Orders</a>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    <a href="signup.html" class="dropdown-item" id="signupLink"><i class="fas fa-user-plus"></i> Sign Up</a>
                    <a href="login.html" class="dropdown-item" id="loginLink"><i class="fas fa-sign-in-alt"></i> Login</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-receipt"></i> My Orders</h1>
            <span class="order-count" id="orderCount">0 orders</span>
        </div>

        <div class="filter-tabs" id="filterTabs">
            <button class="active" data-filter="all" onclick="filterOrders('all')">All</button>
            <button data-filter="Processing" onclick="filterOrders('Processing')">Processing</button>
            <button data-filter="Shipped" onclick="filterOrders('Shipped')">Shipped</button>
            <button data-filter="Delivered" onclick="filterOrders('Delivered')">Delivered</button>
            <button data-filter="Cancelled" onclick="filterOrders('Cancelled')">Cancelled</button>
        </div>

        <div id="ordersContainer">
            <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
        </div>

        <footer class="footer">
            <a href="index.html" class="logo"><i class="fas fa-store-alt"></i> Market<span>Stall</span></a>
            <p>&copy; 2026 MarketStall Investments.</p>
        </footer>
    </div>

    <nav class="bottom-nav">
        <a href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="products.html"><i class="fas fa-th-list"></i><span>Products</span></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i><span>Cart</span><span class="nav-badge" id="bottomCartBadge">0</span></a>
        <a href="transactions.html" class="active"><i class="fas fa-receipt"></i><span>Orders</span></a>
        <a href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

    <!-- TRACKING MODAL -->
    <div class="modal-overlay" id="trackingModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeTracking()">&times;</button>
            <h2><i class="fas fa-truck"></i> Order Tracking</h2>
            <div id="trackingDetails"></div>
        </div>
    </div>

    <script>
        // ===== TOAST =====
        class ToastManager {
            constructor() { this.container = null; this.init(); }
            init() {
                if (!document.querySelector('.toast-container')) {
                    this.container = document.createElement('div');
                    this.container.className = 'toast-container';
                    document.body.appendChild(this.container);
                } else { this.container = document.querySelector('.toast-container'); }
            }
            show(message, options) {
                options = options || {};
                var type = options.type || 'info';
                var title = options.title || '';
                var duration = options.duration || 3000;
                var toast = document.createElement('div');
                toast.className = 'toast toast-' + type;
                var icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-circle', info: 'fa-info-circle' };
                var defaultTitles = { success: 'Success', error: 'Error', warning: 'Warning', info: 'Info' };
                var displayTitle = title || defaultTitles[type] || defaultTitles.info;
                toast.innerHTML =
                    '<div class="toast-icon"><i class="fas ' + icons[type] + '"></i></div>' +
                    '<div class="toast-content"><div class="toast-title">' + displayTitle + '</div><div class="toast-message">' + message + '</div></div>' +
                    '<button class="toast-close" onclick="this.closest(\'.toast\').remove()">&times;</button>' +
                    '<div class="toast-progress"></div>';
                this.container.appendChild(toast);
                setTimeout(function() { toast.classList.add('show'); }, 10);
                var timeout = setTimeout(function() {
                    if (toast.parentNode) {
                        toast.classList.remove('show');
                        toast.classList.add('hide');
                        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 400);
                    }
                }, duration);
                toast.addEventListener('click', function(e) {
                    if (e.target.closest('.toast-close')) return;
                    if (toast.parentNode) {
                        toast.classList.remove('show');
                        toast.classList.add('hide');
                        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 400);
                    }
                    clearTimeout(timeout);
                });
                return toast;
            }
            success(message, title) { return this.show(message, { type: 'success', title: title || '' }); }
            error(message, title) { return this.show(message, { type: 'error', title: title || '' }); }
            warning(message, title) { return this.show(message, { type: 'warning', title: title || '' }); }
            info(message, title) { return this.show(message, { type: 'info', title: title || '' }); }
        }
        window.toast = new ToastManager();

        // ===== PROFILE =====
        function toggleProfileMenu() {
            document.getElementById('profileDropdown').classList.toggle('show');
        }
        document.addEventListener('click', function(e) {
            var menu = document.querySelector('.profile-menu');
            if (menu && !menu.contains(e.target)) {
                document.getElementById('profileDropdown').classList.remove('show');
            }
        });

        function updateProfileUI() {
            var currentUser = JSON.parse(localStorage.getItem('currentUser'));
            var dropdown = document.getElementById('profileDropdown');
            var signupLink = document.getElementById('signupLink');
            var loginLink = document.getElementById('loginLink');

            if (currentUser) {
                var name = currentUser.name || 'User';
                var email = currentUser.email || 'user@example.com';
                var initial = name.charAt(0).toUpperCase();

                document.getElementById('avatarLetter').textContent = initial;
                document.getElementById('profileName').textContent = name.split(' ')[0];
                document.getElementById('dropdownName').textContent = name;
                document.getElementById('dropdownEmail').textContent = email;

                signupLink.style.display = 'none';
                loginLink.style.display = 'none';
                var logoutBtn = dropdown.querySelector('.dropdown-item.logout');
                if (logoutBtn) logoutBtn.style.display = 'flex';
            } else {
                document.getElementById('avatarLetter').textContent = 'U';
                document.getElementById('profileName').textContent = 'Account';
                document.getElementById('dropdownName').textContent = 'Not Logged In';
                document.getElementById('dropdownEmail').textContent = 'Please sign in';

                signupLink.style.display = 'flex';
                loginLink.style.display = 'flex';
                var logoutBtn = dropdown.querySelector('.dropdown-item.logout');
                if (logoutBtn) logoutBtn.style.display = 'none';
            }
        }

        window.logout = async function() {
            if (!confirm('Logout?')) return;
            try {
                var client = getSupabaseClient();
                if (client) { await client.auth.signOut(); }
                localStorage.removeItem('currentUser');
                updateProfileUI();
                updateCartCount();
                toast.success('Logged out.', 'Goodbye');
                setTimeout(function() { location.reload(); }, 500);
            } catch (e) { toast.error('Error logging out.', 'Error'); }
        };

        function getSupabaseClient() { return window.supabaseClient || null; }
        function waitForSupabase() {
            return new Promise(function(resolve) {
                if (window.supabaseClient) { resolve(window.supabaseClient); return; }
                var checkInterval = setInterval(function() {
                    if (window.supabaseClient) { clearInterval(checkInterval); resolve(window.supabaseClient); }
                }, 200);
                setTimeout(function() { clearInterval(checkInterval); resolve(window.supabaseClient || null); }, 8000);
            });
        }

        // ===== CART =====
        function updateCartCount() {
            var cart = JSON.parse(localStorage.getItem('cart')) || [];
            var count = 0;
            for (var i = 0; i < cart.length; i++) { count += cart[i].quantity || 0; }
            var badge = document.getElementById('dropdownCartBadge');
            if (badge) badge.textContent = count;
            var bottomBadge = document.getElementById('bottomCartBadge');
            if (bottomBadge) bottomBadge.textContent = count;
        }

        // ===== ORDERS =====
        var currentFilter = 'all';
        var orders = [];

        async function loadOrders() {
            var container = document.getElementById('ordersContainer');
            try {
                var client = getSupabaseClient();
                orders = [];

                if (client) {
                    var { data: { session } } = await client.auth.getSession();
                    var query = client.from('orders').select('*');

                    if (session) {
                        query = query.eq('user_id', session.user.id);
                    } else {
                        var currentUser = JSON.parse(localStorage.getItem('currentUser'));
                        if (currentUser && currentUser.email) {
                            query = query.eq('guest_email', currentUser.email);
                        }
                    }

                    var { data, error } = await query.order('created_at', { ascending: false });

                    if (!error && data && data.length > 0) {
                        orders = data;
                        // Save to localStorage for offline
                        localStorage.setItem('orders', JSON.stringify(data));
                        renderOrders(orders);
                        return;
                    }
                }

                // Fallback to localStorage
                var stored = JSON.parse(localStorage.getItem('orders')) || [];
                if (stored.length > 0) {
                    orders = stored;
                    renderOrders(orders);
                    return;
                }

                // If no orders, show empty state with sample
                renderOrders([]);

            } catch (e) {
                console.warn('Error loading orders:', e);
                var stored = JSON.parse(localStorage.getItem('orders')) || [];
                renderOrders(stored);
            }
        }

        function renderOrders(ordersList) {
            var container = document.getElementById('ordersContainer');
            var countDisplay = document.getElementById('orderCount');

            var filtered = ordersList;
            if (currentFilter !== 'all') {
                filtered = ordersList.filter(function(o) {
                    return o.status === currentFilter;
                });
            }

            if (!filtered || filtered.length === 0) {
                var message = currentFilter !== 'all' ? 'No orders with status "' + currentFilter + '".' : 'Start shopping to see your orders!';
                container.innerHTML = '<div class="empty-state"><i class="fas fa-receipt"></i><h3>No orders found</h3><p>' + message + '</p><a href="products.html" class="btn-shop">Start Shopping</a></div>';
                countDisplay.textContent = '0 orders';
                return;
            }

            countDisplay.textContent = filtered.length + ' orders';

            var html = '';
            for (var i = 0; i < filtered.length; i++) {
                var order = filtered[i];
                var statusClass = 'status-processing';
                if (order.status === 'Shipped') statusClass = 'status-shipped';
                else if (order.status === 'Delivered') statusClass = 'status-delivered';
                else if (order.status === 'Cancelled') statusClass = 'status-cancelled';

                var orderNumber = order.order_number || order.id || 'N/A';
                var orderDate = order.date || order.created_at ? new Date(order.created_at).toLocaleDateString() : 'N/A';

                var itemsHtml = '';
                var items = order.items || [];
                if (items.length > 0) {
                    for (var j = 0; j < items.length; j++) {
                        var item = items[j];
                        itemsHtml += '<div class="order-item"><span class="item-name"><i class="fas ' + (item.image || 'fa-box') + '"></i> ' + item.name + ' × ' + (item.quantity || 1) + '</span><span>$' + (item.price * (item.quantity || 1)).toFixed(2) + '</span></div>';
                    }
                }

                var canCancel = order.status === 'Processing' || order.status === 'Shipped';
                var orderTotal = order.total || 0;

                html += '<div class="order-card">' +
                    '<div class="order-header">' +
                    '<div><span class="order-id"><i class="fas fa-hashtag"></i> #' + orderNumber + '</span><span class="order-date"> ' + orderDate + '</span></div>' +
                    '<span class="order-status ' + statusClass + '">' + (order.status || 'Processing') + '</span></div>' +
                    '<div class="order-items">' + itemsHtml + '</div>' +
                    '<div class="order-footer">' +
                    '<div class="total">Total: <span>$' + parseFloat(orderTotal).toFixed(2) + '</span></div>' +
                    '<div class="order-actions">' +
                    '<button class="track-btn" onclick="trackOrder(\'' + orderNumber + '\')"><i class="fas fa-truck"></i> Track</button>' +
                    '<button class="reorder-btn" onclick="reorder(\'' + orderNumber + '\')"><i class="fas fa-redo"></i> Reorder</button>' +
                    (canCancel ? '<button class="cancel-btn" onclick="cancelOrder(\'' + orderNumber + '\')"><i class="fas fa-times"></i> Cancel</button>' : '') +
                    '</div></div></div>';
            }
            container.innerHTML = html;
        }

        // ===== ORDER ACTIONS =====
        window.filterOrders = function(filter) {
            currentFilter = filter;
            var tabs = document.querySelectorAll('.filter-tabs button');
            for (var i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove('active');
                if (tabs[i].getAttribute('data-filter') === filter) { tabs[i].classList.add('active'); }
            }
            renderOrders(orders);
        };

        window.trackOrder = function(orderId) {
            var order = null;
            for (var i = 0; i < orders.length; i++) {
                if (orders[i].order_number === orderId || orders[i].id == orderId) {
                    order = orders[i];
                    break;
                }
            }
            if (!order) { toast.error('Order not found.', 'Error'); return; }

            var statuses = ['Processing', 'Shipped', 'Out for Delivery', 'Delivered'];
            var currentIndex = statuses.indexOf(order.status);
            if (currentIndex === -1) currentIndex = 0;

            var steps = [
                { status: 'Order Confirmed', description: 'Your order has been confirmed.', time: '1 hour ago' },
                { status: 'Preparing for Shipment', description: 'We are preparing your items.', time: '2 hours ago' },
                { status: 'Shipped', description: 'Your order has been shipped!', time: '1 day ago' },
                { status: 'Out for Delivery', description: 'Your package is out for delivery.', time: '2 days ago' },
                { status: 'Delivered', description: 'Your order has been delivered!', time: '3 days ago' }
            ];

            var showSteps = steps.slice(0, currentIndex + 2);
            var details = document.getElementById('trackingDetails');
            var stepHtml = '';
            for (var j = 0; j < showSteps.length; j++) {
                var isActive = j <= currentIndex;
                var isCurrent = j === currentIndex;
                var dotClass = 'step-dot';
                if (isCurrent) dotClass += ' current';
                else if (isActive) dotClass += ' active';

                stepHtml += '<div class="tracking-step"><span class="' + dotClass + '"></span><div class="step-content"><h4>' + showSteps[j].status + '</h4><p>' + showSteps[j].description + '</p></div></div>';
            }

            details.innerHTML = '<div style="margin-bottom:12px; padding:10px 14px; background:#f8f9fa; border-radius:8px;"><p><strong>Order #' + (order.order_number || order.id) + '</strong></p><p style="color:#5b768b; font-size:0.85rem;">Status: ' + (order.status || 'Processing') + '</p><p style="color:#5b768b; font-size:0.85rem;">Total: $' + (order.total || 0).toFixed(2) + '</p></div>' + stepHtml;

            document.getElementById('trackingModal').classList.add('active');
        };

        window.closeTracking = function() {
            document.getElementById('trackingModal').classList.remove('active');
        };
        document.getElementById('trackingModal').addEventListener('click', function(e) {
            if (e.target === this) closeTracking();
        });

        window.cancelOrder = function(orderId) {
            if (!confirm('Cancel this order?')) return;
            for (var i = 0; i < orders.length; i++) {
                if (orders[i].order_number === orderId || orders[i].id == orderId) {
                    orders[i].status = 'Cancelled';
                    localStorage.setItem('orders', JSON.stringify(orders));
                    toast.success('Order cancelled.', 'Cancelled');

                    // Try to update in Supabase
                    var client = getSupabaseClient();
                    if (client && orders[i].id) {
                        client.from('orders')
                            .update({ status: 'Cancelled' })
                            .eq('id', orders[i].id)
                            .then(function(result) {
                                if (result.error) console.warn('Supabase update error:', result.error);
                            });
                    }
                    renderOrders(orders);
                    return;
                }
            }
        };

        window.reorder = function(orderId) {
            var order = null;
            for (var i = 0; i < orders.length; i++) {
                if (orders[i].order_number === orderId || orders[i].id == orderId) {
                    order = orders[i];
                    break;
                }
            }
            if (!order || !order.items) { toast.error('Cannot reorder.', 'Error'); return; }

            var cart = JSON.parse(localStorage.getItem('cart')) || [];
            for (var j = 0; j < order.items.length; j++) {
                var item = order.items[j];
                var existing = null;
                for (var c = 0; c < cart.length; c++) {
                    if (cart[c].name === item.name) { existing = cart[c]; break; }
                }
                if (existing) {
                    existing.quantity += (item.quantity || 1);
                } else {
                    cart.push({
                        id: Date.now() + j,
                        name: item.name,
                        price: item.price,
                        image: item.image || 'fa-box',
                        quantity: (item.quantity || 1)
                    });
                }
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            toast.success('Items added to cart!', 'Added');
            setTimeout(function() { window.location.href = 'cart.html'; }, 800);
        };

        // ===== SEARCH =====
        window.searchProducts = function() {
            var query = document.getElementById('searchInput').value.trim();
            if (query === '') { toast.info('Enter a search term.', 'Search'); return; }
            window.location.href = 'products.html?search=' + encodeURIComponent(query);
        };
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchProducts();
        });

        // ===== INIT =====
        async function init() {
            var client = await waitForSupabase();
            if (client) { console.log('✅ Supabase connected'); } else { console.log('⚠️ Using fallback data'); }

            updateProfileUI();
            await loadOrders();
            updateCartCount();
            console.log('✅ Orders page loaded!');
        }

        document.addEventListener('DOMContentLoaded', init);
        document.addEventListener('supabaseReady', init);
    </script>
</body>
</html>
