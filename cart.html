<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - MarketStall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="supabase.js"></script>
    <style>
        /* Same styles as index */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f5f7fa; color: #0b1b2b; padding-bottom: 70px; }
        a { text-decoration: none; color: inherit; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 380px; width: 90%; pointer-events: none; }
        .toast { background: #ffffff; border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); border-left: 4px solid #2a7de1; display: flex; align-items: center; gap: 12px; transform: translateX(120%); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: auto; position: relative; overflow: hidden; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.hide { transform: translateX(120%); opacity: 0; }
        .toast-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
        .toast-success .toast-icon { background: #d4edda; color: #155724; }
        .toast-error .toast-icon { background: #f8d7da; color: #721c24; }
        .toast-warning .toast-icon { background: #fff3cd; color: #856404; }
        .toast-info .toast-icon { background: #d1ecf1; color: #0c5460; }
        .toast-success { border-left-color: #28a745; }
        .toast-error { border-left-color: #dc3545; }
        .toast-warning { border-left-color: #ffc107; }
        .toast-info { border-left-color: #17a2b8; }
        .toast-content { flex: 1; }
        .toast-content .toast-title { font-weight: 600; font-size: 0.9rem; color: #0b1b2b; }
        .toast-content .toast-message { font-size: 0.82rem; color: #5b768b; }
        .toast-close { background: none; border: none; color: #999; cursor: pointer; font-size: 1.1rem; padding: 0 4px; }
        .toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; animation: toastProgress 4s linear forwards; }
        .toast-success .toast-progress { background: #28a745; }
        .toast-error .toast-progress { background: #dc3545; }
        .toast-warning .toast-progress { background: #ffc107; }
        .toast-info .toast-progress { background: #17a2b8; }
        @keyframes toastProgress { 0% { width: 100%; } 100% { width: 0%; } }

        .header { position: sticky; top: 0; z-index: 100; background: #ffffff; padding: 12px 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border-bottom: 1px solid #eef2f6; }
        .header-top { display: flex; align-items: center; gap: 12px; max-width: 1280px; margin: 0 auto; }
        .logo { font-size: 1.3rem; font-weight: 700; color: #0b1b2b; flex-shrink: 0; }
        .logo i { color: #f8b400; }
        .logo span { color: #2a7de1; }
        .search-bar { flex: 1; display: flex; background: #f1f4f8; border-radius: 30px; overflow: hidden; height: 40px; max-width: 500px; }
        .search-bar input { flex: 1; border: none; background: transparent; padding: 0 16px; font-size: 0.85rem; outline: none; }
        .search-bar button { border: none; background: #f8b400; color: #0b1b2b; padding: 0 18px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
        .search-bar button:hover { background: #e0a000; }
        .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .header-actions a { color: #1f3a4b; font-size: 1.1rem; position: relative; padding: 4px 6px; transition: 0.2s; }
        .header-actions a:hover { color: #f8b400; }
        .cart-badge { position: absolute; top: -4px; right: -4px; background: #dc3545; color: #fff; border-radius: 50%; font-size: 0.55rem; font-weight: 700; padding: 1px 5px; min-width: 16px; text-align: center; }
        .btn-signup { background: #f8b400; color: #0b1b2b; padding: 4px 14px; border-radius: 30px; font-size: 0.75rem; font-weight: 600; transition: 0.2s; }
        .btn-signup:hover { background: #e0a000; transform: translateY(-2px); }
        .btn-logout { background: #dc3545; color: #fff; padding: 4px 14px; border-radius: 30px; border: none; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-logout:hover { background: #c82333; transform: translateY(-2px); }
        .user-greeting { font-size: 0.75rem; font-weight: 500; color: #1f3a4b; display: flex; align-items: center; gap: 4px; }
        .user-greeting i { color: #f8b400; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; display: flex; justify-content: space-around; align-items: center; padding: 6px 0 10px; box-shadow: 0 -2px 16px rgba(0,0,0,0.06); border-top: 1px solid #eef2f6; z-index: 999; height: 64px; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; color: #868e96; font-size: 0.6rem; font-weight: 500; transition: 0.2s; padding: 2px 8px; position: relative; min-width: 50px; }
        .bottom-nav a i { font-size: 1.2rem; margin-bottom: 2px; }
        .bottom-nav a:hover { color: #f8b400; }
        .bottom-nav a.active { color: #f8b400; }
        .bottom-nav a .nav-badge { position: absolute; top: -4px; right: 2px; background: #dc3545; color: #fff; border-radius: 50%; font-size: 0.5rem; font-weight: 700; padding: 1px 5px; min-width: 16px; text-align: center; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 12px; flex-wrap: wrap; gap: 8px; }
        .page-header h1 { font-size: 1.2rem; font-weight: 700; }
        .page-header h1 i { color: #f8b400; margin-right: 6px; }
        .page-header .item-count { font-size: 0.8rem; color: #5b768b; background: #f1f4f8; padding: 4px 14px; border-radius: 30px; }

        .cart-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .cart-items { background: #ffffff; border-radius: 12px; border: 1px solid #eef2f6; padding: 16px; min-height: 150px; }
        .cart-item { display: grid; grid-template-columns: 60px 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eef2f6; align-items: center; }
        .cart-item:last-child { border-bottom: none; }
        .cart-item-image { background: #f1f4f8; border-radius: 10px; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #2a7de1; }
        .cart-item-details h4 { font-size: 0.85rem; font-weight: 600; }
        .cart-item-details .price { font-weight: 700; color: #2a7de1; font-size: 0.9rem; }
        .cart-item-actions { display: flex; align-items: center; gap: 6px; }
        .qty-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid #eef2f6; background: #f8f9fa; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .qty-btn:hover { background: #f1f4f8; }
        .qty-display { font-weight: 600; min-width: 20px; text-align: center; font-size: 0.85rem; }
        .remove-btn { background: none; border: none; color: #dc3545; cursor: pointer; font-size: 0.9rem; padding: 4px; transition: 0.2s; }
        .remove-btn:hover { background: #fde8e8; border-radius: 6px; }

        .empty-cart { text-align: center; padding: 30px 16px; }
        .empty-cart i { font-size: 3rem; color: #dce5ed; margin-bottom: 12px; display: block; }
        .empty-cart h3 { font-size: 1rem; margin-bottom: 4px; }
        .empty-cart p { color: #5b768b; font-size: 0.85rem; margin-bottom: 12px; }
        .btn-shop { display: inline-block; padding: 8px 24px; border-radius: 30px; font-weight: 600; font-size: 0.85rem; background: #2a7de1; color: #fff; transition: 0.2s; }
        .btn-shop:hover { background: #1a5fb0; transform: translateY(-2px); }

        .cart-summary { background: #ffffff; border-radius: 12px; border: 1px solid #eef2f6; padding: 16px; }
        .cart-summary h3 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
        .summary-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.85rem; color: #1f3a4b; }
        .summary-row .label { color: #5b768b; }
        .summary-row.total { border-top: 2px solid #eef2f6; padding-top: 12px; margin-top: 6px; font-weight: 700; font-size: 1rem; }
        .checkout-btn { width: 100%; padding: 10px 0; border: none; border-radius: 30px; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: 0.2s; background: #f8b400; color: #0b1b2b; margin-top: 8px; }
        .checkout-btn:hover { background: #e0a000; transform: translateY(-2px); }
        .checkout-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .clear-cart-btn { width: 100%; padding: 8px 0; border: 1px solid #dc3545; border-radius: 30px; background: transparent; color: #dc3545; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: 0.2s; margin-top: 6px; }
        .clear-cart-btn:hover { background: #dc3545; color: #fff; transform: translateY(-2px); }

        .footer { background: #ffffff; border-radius: 12px; padding: 16px; margin: 8px 0 10px; border: 1px solid #eef2f6; text-align: center; }
        .footer .logo { font-size: 1rem; }
        .footer p { font-size: 0.65rem; color: #5b768b; margin-top: 4px; }
        .loading-spinner { display: flex; justify-content: center; align-items: center; padding: 40px 0; }
        .loading-spinner i { font-size: 2rem; color: #f8b400; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (min-width: 640px) {
            body { padding-bottom: 0; }
            .bottom-nav { display: none; }
            .cart-grid { grid-template-columns: 1fr 300px; gap: 20px; }
            .header { padding: 12px 24px; }
            .logo { font-size: 1.5rem; }
            .search-bar { height: 44px; }
            .search-bar input { font-size: 0.95rem; padding: 0 20px; }
            .search-bar button { padding: 0 24px; font-size: 0.95rem; }
            .page-header h1 { font-size: 1.4rem; }
        }
        @media (min-width: 1024px) {
            .container { padding: 0 24px; }
            .cart-item { grid-template-columns: 80px 1fr auto; gap: 16px; }
            .cart-item-image { width: 80px; height: 80px; font-size: 2rem; }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-top">
            <a href="index.html" class="logo"><i class="fas fa-store-alt"></i> Market<span>Stall</span></a>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search products...">
                <button onclick="searchProducts()"><i class="fas fa-search"></i></button>
            </div>
            <div class="header-actions">
                <a href="wishlist.html"><i class="fas fa-heart"></i></a>
                <a href="cart.html"><i class="fas fa-shopping-cart"></i> <span class="cart-badge" id="cartCount">0</span></a>
                <span id="authButtons"></span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-shopping-cart"></i> Shopping Cart</h1>
            <span class="item-count" id="itemCount">0 items</span>
        </div>

        <div class="cart-grid">
            <div class="cart-items" id="cartItems">
                <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
            </div>
            <div class="cart-summary">
                <h3>Order Summary</h3>
                <div id="summaryContent">
                    <div class="summary-row"><span class="label">Subtotal</span><span>$0.00</span></div>
                    <div class="summary-row"><span class="label">Shipping</span><span>Calculated at checkout</span></div>
                    <div class="summary-row total"><span>Total</span><span id="totalAmount">$0.00</span></div>
                    <button class="checkout-btn" id="checkoutBtn" onclick="proceedToCheckout()"><i class="fas fa-lock"></i> Proceed to Checkout</button>
                    <button class="clear-cart-btn" onclick="clearCart()"><i class="fas fa-trash"></i> Clear Cart</button>
                </div>
            </div>
        </div>

        <footer class="footer">
            <a href="index.html" class="logo"><i class="fas fa-store-alt"></i> Market<span>Stall</span></a>
            <p>&copy; 2026 MarketStall Investments.</p>
        </footer>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <a href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="products.html"><i class="fas fa-th-list"></i><span>Products</span></a>
        <a href="cart.html" class="active"><i class="fas fa-shopping-cart"></i><span>Cart</span><span class="nav-badge" id="bottomCartBadge">0</span></a>
        <a href="transactions.html"><i class="fas fa-receipt"></i><span>Orders</span></a>
        <a href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

    <script>
        // Toast system
        class ToastManager {
            constructor() { this.container = null; this.init(); }
            init() {
                if (!document.querySelector('.toast-container')) {
                    this.container = document.createElement('div');
                    this.container.className = 'toast-container';
                    document.body.appendChild(this.container);
                } else { this.container = document.querySelector('.toast-container'); }
            }
            show(message, options) {
                options = options || {};
                var type = options.type || 'info';
                var title = options.title || '';
                var duration = options.duration || 3000;
                var toast = document.createElement('div');
                toast.className = 'toast toast-' + type;
                var icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-circle', info: 'fa-info-circle' };
                var defaultTitles = { success: 'Success', error: 'Error', warning: 'Warning', info: 'Info' };
                var displayTitle = title || defaultTitles[type] || defaultTitles.info;
                toast.innerHTML =
                    '<div class="toast-icon"><i class="fas ' + icons[type] + '"></i></div>' +
                    '<div class="toast-content"><div class="toast-title">' + displayTitle + '</div><div class="toast-message">' + message + '</div></div>' +
                    '<button class="toast-close" onclick="this.closest(\'.toast\').remove()">&times;</button>' +
                    '<div class="toast-progress"></div>';
                this.container.appendChild(toast);
                setTimeout(function() { toast.classList.add('show'); }, 10);
                var timeout = setTimeout(function() {
                    if (toast.parentNode) {
                        toast.classList.remove('show');
                        toast.classList.add('hide');
                        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 400);
                    }
                }, duration);
                toast.addEventListener('click', function(e) {
                    if (e.target.closest('.toast-close')) return;
                    if (toast.parentNode) {
                        toast.classList.remove('show');
                        toast.classList.add('hide');
                        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 400);
                    }
                    clearTimeout(timeout);
                });
                return toast;
            }
            success(message, title) { return this.show(message, { type: 'success', title: title || '' }); }
            error(message, title) { return this.show(message, { type: 'error', title: title || '' }); }
            warning(message, title) { return this.show(message, { type: 'warning', title: title || '' }); }
            info(message, title) { return this.show(message, { type: 'info', title: title || '' }); }
        }
        window.toast = new ToastManager();

        let supabase = null;
        let supabaseReady = false;

        function waitForSupabase() {
            return new Promise((resolve) => {
                if (window.supabaseClient) { resolve(window.supabaseClient); return; }
                document.addEventListener('supabaseReady', function() { resolve(window.supabaseClient); });
                setTimeout(() => { resolve(window.supabaseClient || null); }, 5000);
            });
        }

        // ===== AUTH =====
        async function updateAuthButtons() {
            var authContainer = document.getElementById('authButtons');
            try {
                const client = await waitForSupabase();
                if (!client) { authContainer.innerHTML = '<a href="signup.html" class="btn-signup"><i class="fas fa-user-plus"></i> Sign Up</a>'; return; }
                const { data: { session } } = await client.auth.getSession();
                if (session) {
                    const email = session.user.email || 'User';
                    authContainer.innerHTML =
                        '<span class="user-greeting"><i class="fas fa-user-circle"></i> ' + email.split('@')[0] + '</span>' +
                        '<button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>';
                } else {
                    authContainer.innerHTML = '<a href="signup.html" class="btn-signup"><i class="fas fa-user-plus"></i> Sign Up</a>';
                }
            } catch (e) {
                authContainer.innerHTML = '<a href="signup.html" class="btn-signup"><i class="fas fa-user-plus"></i> Sign Up</a>';
            }
        }

        window.logout = async function() {
            if (!confirm('Logout?')) return;
            try {
                const client = await waitForSupabase();
                if (client) await client.auth.signOut();
                localStorage.removeItem('currentUser');
                updateAuthButtons();
                toast.success('Logged out.', 'Goodbye');
                setTimeout(() => location.reload(), 500);
            } catch (e) { toast.error('Error logging out.', 'Error'); }
        };

        // ===== CART FUNCTIONS =====
        let cartItems = [];
        let cartId = null;

        async function loadCart() {
            var container = document.getElementById('cartItems');
            var summary = document.getElementById('summaryContent');
            var checkoutBtn = document.getElementById('checkoutBtn');

            try {
                const client = await waitForSupabase();
                if (!client) {
                    // Fallback to local storage
                    loadLocalCart();
                    return;
                }

                const { data: { session } } = await client.auth.getSession();

                if (!session) {
                    loadLocalCart();
                    return;
                }

                // Get or create cart
                let { data: cartData } = await client
                    .from('carts')
                    .select('*')
                    .eq('user_id', session.user.id)
                    .single();

                if (!cartData) {
                    const { data: newCart } = await client
                        .from('carts')
                        .insert({ user_id: session.user.id })
                        .select()
                        .single();
                    cartData = newCart;
                }

                if (!cartData) {
                    loadLocalCart();
                    return;
                }

                cartId = cartData.id;

                // Get cart items with product details
                const { data: items, error } = await client
                    .from('cart_items')
                    .select(`
                        *,
                        products!inner(
                            id, name, price, image, stock
                        )
                    `)
                    .eq('cart_id', cartId);

                if (error) throw error;

                cartItems = items || [];
                renderCartItems(cartItems);

            } catch (e) {
                console.warn('Error loading cart from Supabase:', e);
                loadLocalCart();
            }
        }

        function loadLocalCart() {
            var cart = JSON.parse(localStorage.getItem('cart')) || [];
            cartItems = cart.map(function(item) {
                return {
                    id: item.id,
                    product_id: item.id,
                    quantity: item.quantity || 1,
                    products: {
                        id: item.id,
                        name: item.name,
                        price: item.price,
                        image: item.image || 'fa-box',
                        stock: 999
                    }
                };
            });
            renderCartItems(cartItems);
        }

        function renderCartItems(items) {
            var container = document.getElementById('cartItems');
            var summary = document.getElementById('summaryContent');
            var checkoutBtn = document.getElementById('checkoutBtn');

            var itemCount = document.getElementById('itemCount');

            if (!items || items.length === 0) {
                container.innerHTML = '<div class="empty-cart"><i class="fas fa-shopping-cart"></i><h3>Your cart is empty</h3><p>Start shopping to add items!</p><a href="products.html" class="btn-shop"><i class="fas fa-shopping-bag"></i> Start Shopping</a></div>';
                summary.innerHTML =
                    '<div class="summary-row"><span class="label">Subtotal</span><span>$0.00</span></div>' +
                    '<div class="summary-row"><span class="label">Shipping</span><span>Calculated at checkout</span></div>' +
                    '<div class="summary-row total"><span>Total</span><span id="totalAmount">$0.00</span></div>' +
                    '<button class="checkout-btn" onclick="proceedToCheckout()" disabled><i class="fas fa-lock"></i> Proceed to Checkout</button>' +
                    '<button class="clear-cart-btn" onclick="clearCart()" disabled><i class="fas fa-trash"></i> Clear Cart</button>';
                itemCount.textContent = '0 items';
                updateBadges(0);
                return;
            }

            var subtotal = 0;
            var totalItems = 0;
            var html = '';

            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                var product = item.products || {};
                var price = parseFloat(product.price || 0);
                var quantity = item.quantity || 1;
                var itemTotal = price * quantity;
                subtotal += itemTotal;
                totalItems += quantity;

                var stockWarning = '';
                if (product.stock !== undefined && quantity > product.stock) {
                    stockWarning = '<span style="color:#dc3545; font-size:0.7rem; display:block;">⚠️ Only ' + product.stock + ' left</span>';
                }

                html += '<div class="cart-item" data-id="' + item.id + '">' +
                    '<div class="cart-item-image"><i class="fas ' + (product.image || 'fa-box') + '"></i></div>' +
                    '<div class="cart-item-details"><h4>' + (product.name || 'Product') + '</h4><span class="price">$' + price.toFixed(2) + '</span>' + stockWarning + '</div>' +
                    '<div class="cart-item-actions">' +
                    '<button class="qty-btn" onclick="updateQuantity(\'' + item.id + '\', ' + (item.product_id || item.id) + ', -1)">−</button>' +
                    '<span class="qty-display">' + quantity + '</span>' +
                    '<button class="qty-btn" onclick="updateQuantity(\'' + item.id + '\', ' + (item.product_id || item.id) + ', 1)">+</button>' +
                    '<button class="remove-btn" onclick="removeItem(\'' + item.id + '\', ' + (item.product_id || item.id) + ')"><i class="fas fa-trash"></i></button>' +
                    '</div></div>';
            }

            container.innerHTML = html;

            summary.innerHTML =
                '<div class="summary-row"><span class="label">Subtotal</span><span>$' + subtotal.toFixed(2) + '</span></div>' +
                '<div class="summary-row"><span class="label">Shipping</span><span>Calculated at checkout</span></div>' +
                '<div class="summary-row total"><span>Total</span><span id="totalAmount">$' + subtotal.toFixed(2) + '</span></div>' +
                '<button class="checkout-btn" onclick="proceedToCheckout()"><i class="fas fa-lock"></i> Proceed to Checkout</button>' +
                '<button class="clear-cart-btn" onclick="clearCart()"><i class="fas fa-trash"></i> Clear Cart</button>';

            itemCount.textContent = totalItems + ' items';
            updateBadges(totalItems);
        }

        // ===== CART ACTIONS =====
        window.updateQuantity = async function(cartItemId, productId, change) {
            try {
                const client = await waitForSupabase();
                if (!client) {
                    // Local storage fallback
                    var cart = JSON.parse(localStorage.getItem('cart')) || [];
                    for (var i = 0; i < cart.length; i++) {
                        if (cart[i].id === productId) {
                            var newQty = (cart[i].quantity || 1) + change;
                            if (newQty <= 0) {
                                cart.splice(i, 1);
                                toast.success('Item removed.', 'Removed');
                            } else {
                                cart[i].quantity = newQty;
                            }
                            localStorage.setItem('cart', JSON.stringify(cart));
                            loadCart();
                            return;
                        }
                    }
                    return;
                }

                const { data: { session } } = await client.auth.getSession();
                if (!session) {
                    var cart = JSON.parse(localStorage.getItem('cart')) || [];
                    for (var j = 0; j < cart.length; j++) {
                        if (cart[j].id === productId) {
                            var newQty = (cart[j].quantity || 1) + change;
                            if (newQty <= 0) {
                                cart.splice(j, 1);
                                toast.success('Item removed.', 'Removed');
                            } else {
                                cart[j].quantity = newQty;
                            }
                            localStorage.setItem('cart', JSON.stringify(cart));
                            loadCart();
                            return;
                        }
                    }
                    return;
                }

                // Get product to check stock
                const { data: product } = await client
                    .from('products')
                    .select('stock')
                    .eq('id', productId)
                    .single();

                // Get current cart item
                const { data: currentItem } = await client
                    .from('cart_items')
                    .select('quantity')
                    .eq('id', cartItemId)
                    .single();

                var currentQty = currentItem ? currentItem.quantity : 0;
                var newQty = currentQty + change;

                if (newQty <= 0) {
                    await client
                        .from('cart_items')
                        .delete()
                        .eq('id', cartItemId);
                    toast.success('Item removed.', 'Removed');
                } else if (product && newQty > product.stock) {
                    toast.warning('Not enough stock! Only ' + product.stock + ' available.', 'Stock Limit');
                    return;
                } else {
                    await client
                        .from('cart_items')
                        .update({ quantity: newQty })
                        .eq('id', cartItemId);
                }

                loadCart();

            } catch (e) {
                toast.error('Error updating cart.', 'Error');
            }
        };

        window.removeItem = async function(cartItemId, productId) {
            if (!confirm('Remove this item?')) return;

            try {
                const client = await waitForSupabase();
                if (!client) {
                    var cart = JSON.parse(localStorage.getItem('cart')) || [];
                    for (var i = 0; i < cart.length; i++) {
                        if (cart[i].id === productId) {
                            var removed = cart[i];
                            cart.splice(i, 1);
                            localStorage.setItem('cart', JSON.stringify(cart));
                            loadCart();
                            toast.success(removed.name + ' removed.', 'Removed');
                            return;
                        }
                    }
                    return;
                }

                const { data: { session } } = await client.auth.getSession();
                if (!session) {
                    var cart = JSON.parse(localStorage.getItem('cart')) || [];
                    for (var j = 0; j < cart.length; j++) {
                        if (cart[j].id === productId) {
                            var removed = cart[j];
                            cart.splice(j, 1);
                            localStorage.setItem('cart', JSON.stringify(cart));
                            loadCart();
                            toast.success(removed.name + ' removed.', 'Removed');
                            return;
                        }
                    }
                    return;
                }

                await client
                    .from('cart_items')
                    .delete()
                    .eq('id', cartItemId);

                loadCart();
                toast.success('Item removed.', 'Removed');

            } catch (e) {
                toast.error('Error removing item.', 'Error');
            }
        };

        window.clearCart = async function() {
            if (!confirm('Clear all items?')) return;

            try {
                const client = await waitForSupabase();
                if (!client) {
                    localStorage.setItem('cart', JSON.stringify([]));
                    loadCart();
                    toast.success('Cart cleared.', 'Cleared');
                    return;
                }

                const { data: { session } } = await client.auth.getSession();
                if (!session) {
                    localStorage.setItem('cart', JSON.stringify([]));
                    loadCart();
                    toast.success('Cart cleared.', 'Cleared');
                    return;
                }

                await client
                    .from('cart_items')
                    .delete()
                    .eq('cart_id', cartId);

                loadCart();
                toast.success('Cart cleared.', 'Cleared');

            } catch (e) {
                toast.error('Error clearing cart.', 'Error');
            }
        };

        window.proceedToCheckout = function() {
            if (!cartItems || cartItems.length === 0) {
                toast.error('Your cart is empty.', 'Error');
                return;
            }
            window.location.href = 'checkout.html';
        };

        function updateBadges(count) {
            var badge = document.getElementById('cartCount');
            if (badge) badge.textContent = count;
            var bottomBadge = document.getElementById('bottomCartBadge');
            if (bottomBadge) bottomBadge.textContent = count;
        }

        // ===== SEARCH =====
        window.searchProducts = function() {
            var query = document.getElementById('searchInput').value.trim();
            if (query === '') { toast.info('Enter a search term.', 'Search'); return; }
            window.location.href = 'products.html?search=' + encodeURIComponent(query);
        };
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchProducts();
        });

        // ===== INIT =====
        async function init() {
            const client = await waitForSupabase();
            if (client) { console.log('✅ Supabase connected'); }

            await updateAuthButtons();
            await loadCart();

            console.log('✅ Cart page loaded!');
        }

        document.addEventListener('DOMContentLoaded', init);
        document.addEventListener('supabaseReady', init);
    </script>
</body>
