<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - MarketStall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="supabase.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f5f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

        /* Toast */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 380px; width: 90%; pointer-events: none; }
        .toast { background: #ffffff; border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); border-left: 4px solid #2a7de1; display: flex; align-items: center; gap: 12px; transform: translateX(120%); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: auto; position: relative; overflow: hidden; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.hide { transform: translateX(120%); opacity: 0; }
        .toast-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
        .toast-success .toast-icon { background: #d4edda; color: #155724; }
        .toast-error .toast-icon { background: #f8d7da; color: #721c24; }
        .toast-warning .toast-icon { background: #fff3cd; color: #856404; }
        .toast-info .toast-icon { background: #d1ecf1; color: #0c5460; }
        .toast-success { border-left-color: #28a745; }
        .toast-error { border-left-color: #dc3545; }
        .toast-warning { border-left-color: #ffc107; }
        .toast-info { border-left-color: #17a2b8; }
        .toast-content { flex: 1; }
        .toast-content .toast-title { font-weight: 600; font-size: 0.9rem; color: #0b1b2b; }
        .toast-content .toast-message { font-size: 0.82rem; color: #5b768b; }
        .toast-close { background: none; border: none; color: #999; cursor: pointer; font-size: 1.1rem; padding: 0 4px; }
        .toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; animation: toastProgress 4s linear forwards; }
        .toast-success .toast-progress { background: #28a745; }
        .toast-error .toast-progress { background: #dc3545; }
        .toast-warning .toast-progress { background: #ffc107; }
        .toast-info .toast-progress { background: #17a2b8; }
        @keyframes toastProgress { 0% { width: 100%; } 100% { width: 0%; } }

        .card { background: #ffffff; max-width: 420px; width: 100%; border-radius: 24px; padding: 32px 24px; border: 1px solid #eef2f6; box-shadow: 0 8px 32px rgba(0,0,0,0.06); }
        .logo { font-size: 1.5rem; font-weight: 700; color: #0b1b2b; text-align: center; display: block; margin-bottom: 4px; }
        .logo i { color: #f8b400; }
        .logo span { color: #2a7de1; }
        h2 { font-weight: 700; font-size: 1.4rem; text-align: center; margin: 8px 0 4px; }
        .sub { color: #5b768b; text-align: center; font-size: 0.85rem; margin-bottom: 20px; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-weight: 500; font-size: 0.85rem; color: #1f3a4b; margin-bottom: 4px; }
        .field input { width: 100%; padding: 10px 16px; border: 1px solid #eef2f6; border-radius: 12px; font-size: 0.95rem; background: #f8f9fa; transition: 0.2s; outline: none; }
        .field input:focus { border-color: #f8b400; background: #ffffff; box-shadow: 0 0 0 4px rgba(248,180,0,0.08); }
        .field input.error { border-color: #dc3545; }
        .forgot { text-align: right; margin-top: -8px; margin-bottom: 12px; }
        .forgot a { font-size: 0.8rem; color: #2a7de1; text-decoration: none; }
        .btn-primary { width: 100%; padding: 12px 0; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; background: #2a7de1; color: #ffffff; }
        .btn-primary:hover { background: #1a5fb0; transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; justify-content: center; }
        .btn-outline { padding: 8px 20px; border: 1px solid #eef2f6; border-radius: 12px; background: #f8f9fa; color: #1f3a4b; font-weight: 500; font-size: 0.85rem; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-outline:hover { background: #f1f4f8; transform: translateY(-2px); }
        .foot-note { margin-top: 16px; font-size: 0.8rem; color: #5b768b; text-align: center; border-top: 1px solid #eef2f6; padding-top: 16px; }
        .foot-note a { color: #2a7de1; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <a href="index.html" class="logo"><i class="fas fa-store-alt"></i> Market<span>Stall</span></a>
        <h2>Welcome Back</h2>
        <p class="sub"><i class="fas fa-arrow-right"></i> Login to your account</p>

        <form id="loginForm">
            <div class="field">
                <label><i class="far fa-envelope"></i> Email</label>
                <input type="email" id="loginEmail" placeholder="hello@example.com" required>
            </div>
            <div class="field">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <div class="forgot"><a href="#">Forgot password?</a></div>
            <button type="submit" class="btn-primary" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>

        <div class="flex">
            <a href="signup.html" class="btn-outline"><i class="fas fa-user-plus"></i> Sign up</a>
            <a href="index.html" class="btn-outline"><i class="fas fa-home"></i> Home</a>
        </div>

        <div class="foot-note">
            New? <a href="signup.html">Create account</a>
        </div>
    </div>

    <script>
        // Toast system
        class ToastManager {
            constructor() { this.container = null; this.init(); }
            init() {
                if (!document.querySelector('.toast-container')) {
                    this.container = document.createElement('div');
                    this.container.className = 'toast-container';
                    document.body.appendChild(this.container);
                } else { this.container = document.querySelector('.toast-container'); }
            }
            show(message, options) {
                options = options || {};
                var type = options.type || 'info';
                var title = options.title || '';
                var duration = options.duration || 3000;
                var toast = document.createElement('div');
                toast.className = 'toast toast-' + type;
                var icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-circle', info: 'fa-info-circle' };
                var defaultTitles = { success: 'Success', error: 'Error', warning: 'Warning', info: 'Info' };
                var displayTitle = title || defaultTitles[type] || defaultTitles.info;
                toast.innerHTML =
                    '<div class="toast-icon"><i class="fas ' + icons[type] + '"></i></div>' +
                    '<div class="toast-content"><div class="toast-title">' + displayTitle + '</div><div class="toast-message">' + message + '</div></div>' +
                    '<button class="toast-close" onclick="this.closest(\'.toast\').remove()">&times;</button>' +
                    '<div class="toast-progress"></div>';
                this.container.appendChild(toast);
                setTimeout(function() { toast.classList.add('show'); }, 10);
                var timeout = setTimeout(function() {
                    if (toast.parentNode) {
                        toast.classList.remove('show');
                        toast.classList.add('hide');
                        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 400);
                    }
                }, duration);
                toast.addEventListener('click', function(e) {
                    if (e.target.closest('.toast-close')) return;
                    if (toast.parentNode) {
                        toast.classList.remove('show');
                        toast.classList.add('hide');
                        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 400);
                    }
                    clearTimeout(timeout);
                });
                return toast;
            }
            success(message, title) { return this.show(message, { type: 'success', title: title || '' }); }
            error(message, title) { return this.show(message, { type: 'error', title: title || '' }); }
            warning(message, title) { return this.show(message, { type: 'warning', title: title || '' }); }
            info(message, title) { return this.show(message, { type: 'info', title: title || '' }); }
        }
        window.toast = new ToastManager();

        function waitForSupabase() {
            return new Promise(function(resolve) {
                if (window.supabaseClient) { resolve(window.supabaseClient); return; }
                var checkInterval = setInterval(function() {
                    if (window.supabaseClient) { clearInterval(checkInterval); resolve(window.supabaseClient); }
                }, 200);
                setTimeout(function() { clearInterval(checkInterval); resolve(window.supabaseClient || null); }, 8000);
            });
        }

        // Login form
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var email = document.getElementById('loginEmail').value.trim();
            var password = document.getElementById('loginPassword').value;

            var isValid = true;
            if (!email || !email.includes('@')) { document.getElementById('loginEmail').classList.add('error'); isValid = false; }
            if (!password) { document.getElementById('loginPassword').classList.add('error'); isValid = false; }

            if (!isValid) {
                toast.error('Please enter your email and password.', 'Error');
                return;
            }

            var btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Logging in...';

            try {
                var client = await waitForSupabase();

                if (!client) {
                    var users = JSON.parse(localStorage.getItem('users')) || [];
                    var user = null;
                    for (var i = 0; i < users.length; i++) {
                        if (users[i].email === email && users[i].password === password) {
                            user = users[i];
                            break;
                        }
                    }
                    if (user) {
                        localStorage.setItem('currentUser', JSON.stringify({ name: user.name, email: user.email }));
                        toast.success('Welcome back, ' + user.name + '!', 'Login Successful');
                        setTimeout(function() { window.location.href = 'index.html'; }, 1200);
                    } else {
                        var userExists = false;
                        for (var j = 0; j < users.length; j++) {
                            if (users[j].email === email) { userExists = true; break; }
                        }
                        if (userExists) {
                            toast.error('Incorrect password. Please try again.', 'Login Failed');
                            document.getElementById('loginPassword').classList.add('error');
                        } else {
                            toast.error('Account not found. Please sign up.', 'Login Failed');
                            document.getElementById('loginEmail').classList.add('error');
                        }
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                    }
                    return;
                }

                var { data, error } = await client.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    if (error.message && error.message.toLowerCase().includes('invalid credentials')) {
                        toast.error('Invalid email or password.', 'Login Failed');
                    } else {
                        toast.error(error.message, 'Login Failed');
                    }
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                    return;
                }

                if (data && data.user) {
                    var name = data.user.user_metadata?.full_name || email.split('@')[0];
                    localStorage.setItem('currentUser', JSON.stringify({ name: name, email: email }));

                    toast.success('Welcome back, ' + name + '!', 'Login Successful');
                    setTimeout(function() { window.location.href = 'index.html'; }, 1200);
                }

            } catch (e) {
                console.error('Login error:', e);
                toast.error('Error logging in. Please try again.', 'Error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            }
        });

        document.querySelectorAll('.field input').forEach(function(el) {
            el.addEventListener('input', function() { this.classList.remove('error'); });
        });
    </script>
</body>
</html>
