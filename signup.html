<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up · MarketStall Investments</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== GLOBAL STYLES ===== */
        :root {
            --primary: #2a7de1;
            --primary-dark: #1a5fb0;
            --secondary: #f8b400;
            --success: #28a745;
            --danger: #dc3545;
            --gray: #5b768b;
            --dark: #0b1b2b;
        }

        /* ===== TOAST NOTIFICATIONS ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 420px;
            width: 100%;
            pointer-events: none;
        }

        .toast {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
            border-left: 5px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 14px;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }

        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.hide { transform: translateX(120%); opacity: 0; }

        .toast-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .toast-success .toast-icon { background: #d4edda; color: #155724; }
        .toast-error .toast-icon { background: #f8d7da; color: #721c24; }
        .toast-warning .toast-icon { background: #fff3cd; color: #856404; }
        .toast-info .toast-icon { background: #d1ecf1; color: #0c5460; }

        .toast-success { border-left-color: var(--success); }
        .toast-error { border-left-color: var(--danger); }
        .toast-warning { border-left-color: #ffc107; }
        .toast-info { border-left-color: #17a2b8; }

        .toast-content { flex: 1; }
        .toast-content .toast-title { font-weight: 600; font-size: 0.95rem; color: var(--dark); margin-bottom: 2px; }
        .toast-content .toast-message { font-size: 0.85rem; color: var(--gray); }

        .toast-close {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 4px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .toast-close:hover { color: #333; }

        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            animation: toastProgress 4s linear forwards;
        }
        .toast-success .toast-progress { background: var(--success); }
        .toast-error .toast-progress { background: var(--danger); }
        .toast-warning .toast-progress { background: #ffc107; }
        .toast-info .toast-progress { background: #17a2b8; }

        @keyframes toastProgress {
            0% { width: 100%; }
            100% { width: 0%; }
        }

        /* ===== MAIN STYLES ===== */
        * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, sans-serif; }
        body { background:#f5f7fa; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
        .card { background:white; max-width:480px; width:100%; border-radius:48px; padding:2.5rem 2rem; box-shadow:0 20px 40px -12px rgba(0,0,0,0.08); border:1px solid #eef2f6; }
        .logo { font-size:1.8rem; font-weight:700; color:#0f2b3c; text-decoration:none; display:block; text-align:center; margin-bottom:0.5rem; }
        .logo i { color:#f8b400; }
        .logo span { color:#2a7de1; }
        h2 { font-weight:600; font-size:1.8rem; margin:0.5rem 0 0.2rem; text-align:center; }
        .sub { color:#5b768b; text-align:center; margin-bottom:1.8rem; }
        .field { margin-bottom:1.2rem; }
        .field label { display:block; font-weight:500; font-size:0.9rem; color:#1f3a4b; margin-bottom:4px; }
        .field input { width:100%; padding:0.8rem 1.2rem; border:1px solid #dce5ed; border-radius:60px; font-size:1rem; background:#f9fcff; transition:0.2s; }
        .field input:focus { outline:2px solid #f8b400; border-color:transparent; background:white; }
        .field input.error { border-color:#dc3545; outline-color:#dc3545; }
        .btn-primary { background:#2a7de1; color:white; border:none; width:100%; padding:0.9rem; border-radius:60px; font-weight:600; font-size:1rem; cursor:pointer; transition:0.2s; }
        .btn-primary:hover { background:#1a5fb0; }
        .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
        .btn-outline { background:transparent; border:1px solid #dce5ed; color:#1f3a4b; padding:0.7rem 1.8rem; border-radius:60px; font-weight:500; cursor:pointer; transition:0.2s; display:inline-flex; align-items:center; gap:8px; text-decoration:none; }
        .btn-outline:hover { background:#f1f4f8; border-color:#b8cee2; }
        .flex { display:flex; gap:0.8rem; flex-wrap:wrap; margin-top:1.5rem; justify-content:center; }
        .foot-note { margin-top:2rem; font-size:0.85rem; color:#5b768b; text-align:center; border-top:1px solid #e6edf4; padding-top:1.5rem; }
        .foot-note a { color:#2a7de1; text-decoration:none; font-weight:500; }
    </style>
</head>
<body>
<div class="card">
    <a href="index.html" class="logo"><i class="fas fa-store-alt"></i> Market<span>Stall</span></a>
    <h2>Create Account</h2>
    <p class="sub"><i class="far fa-envelope"></i> Join and start shopping</p>

    <form id="signupForm">
        <div class="field">
            <label><i class="far fa-user"></i> Full name *</label>
            <input type="text" id="signupName" placeholder="Alex Rivera" required>
        </div>
        <div class="field">
            <label><i class="far fa-envelope"></i> Email *</label>
            <input type="email" id="signupEmail" placeholder="hello@example.com" required>
        </div>
        <div class="field">
            <label><i class="fas fa-lock"></i> Password *</label>
            <input type="password" id="signupPassword" placeholder="•••••••• (min 6 chars)" required minlength="6">
        </div>
        <button type="submit" class="btn-primary" id="signupBtn"><i class="fas fa-user-plus"></i> Sign up</button>
    </form>

    <div class="flex">
        <a href="login.html" class="btn-outline"><i class="fas fa-sign-in-alt"></i> Login</a>
        <a href="index.html" class="btn-outline"><i class="fas fa-home"></i> Home</a>
        <a href="products.html" class="btn-outline"><i class="fas fa-th-list"></i> Products</a>
    </div>

    <div class="foot-note">
        Already have an account? <a href="login.html">Login</a> · <a href="cart.html">Cart</a> · <a href="transactions.html">Orders</a>
    </div>
</div>

<script>
    // ============================================================
    // UNIFIED NOTIFICATION SYSTEM
    // ============================================================
    class ToastManager {
        constructor() {
            this.container = null;
            this.init();
        }

        init() {
            if (!document.querySelector('.toast-container')) {
                this.container = document.createElement('div');
                this.container.className = 'toast-container';
                document.body.appendChild(this.container);
            } else {
                this.container = document.querySelector('.toast-container');
            }
        }

        show(message, options) {
            options = options || {};
            var type = options.type || 'info';
            var title = options.title || '';
            var duration = options.duration || 4000;
            var icon = options.icon || null;

            var toast = document.createElement('div');
            toast.className = 'toast toast-' + type;

            var icons = {
                success: 'fa-check-circle',
                error: 'fa-times-circle',
                warning: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };

            var iconClass = icon || icons[type] || icons.info;

            var defaultTitles = {
                success: '✅ Success!',
                error: '❌ Error!',
                warning: '⚠️ Warning!',
                info: 'ℹ️ Info'
            };
            var displayTitle = title || defaultTitles[type] || defaultTitles.info;

            toast.innerHTML = 
                '<div class="toast-icon"><i class="fas ' + iconClass + '"></i></div>' +
                '<div class="toast-content">' +
                    '<div class="toast-title">' + displayTitle + '</div>' +
                    '<div class="toast-message">' + message + '</div>' +
                '</div>' +
                '<button class="toast-close" onclick="this.closest(\'.toast\').remove()">&times;</button>' +
                '<div class="toast-progress"></div>';

            this.container.appendChild(toast);

            setTimeout(function() { toast.classList.add('show'); }, 10);

            var timeout = setTimeout(function() { 
                if (toast.parentNode) {
                    toast.classList.remove('show');
                    toast.classList.add('hide');
                    setTimeout(function() { if (toast.parentNode) toast.remove(); }, 500);
                }
            }, duration);

            toast.addEventListener('click', function(e) {
                if (e.target.closest('.toast-close')) return;
                if (toast.parentNode) {
                    toast.classList.remove('show');
                    toast.classList.add('hide');
                    setTimeout(function() { if (toast.parentNode) toast.remove(); }, 500);
                }
                clearTimeout(timeout);
            });

            return toast;
        }

        success(message, title) { return this.show(message, { type: 'success', title: title || '' }); }
        error(message, title) { return this.show(message, { type: 'error', title: title || '' }); }
        warning(message, title) { return this.show(message, { type: 'warning', title: title || '' }); }
        info(message, title) { return this.show(message, { type: 'info', title: title || '' }); }
    }

    window.toast = new ToastManager();

    // ============================================================
    // SIGNUP FORM
    // ============================================================
    document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        var name = document.getElementById('signupName').value.trim();
        var email = document.getElementById('signupEmail').value.trim();
        var password = document.getElementById('signupPassword').value;

        // Validation
        var isValid = true;
        if (!name) {
            document.getElementById('signupName').classList.add('error');
            isValid = false;
        }
        if (!email || !email.includes('@')) {
            document.getElementById('signupEmail').classList.add('error');
            isValid = false;
        }
        if (!password || password.length < 6) {
            document.getElementById('signupPassword').classList.add('error');
            isValid = false;
        }

        if (!isValid) {
            toast.error('Please fill in all fields correctly.', 'Validation Error');
            return;
        }

        // Check if user exists
        var users = JSON.parse(localStorage.getItem('users')) || [];
        var exists = false;
        for (var i = 0; i < users.length; i++) {
            if (users[i].email === email) {
                exists = true;
                break;
            }
        }

        if (exists) {
            toast.error('Email already registered! Please login.', 'Error');
            document.getElementById('signupEmail').classList.add('error');
            return;
        }

        // Save user
        users.push({ 
            name: name, 
            email: email, 
            password: password,
            createdAt: new Date().toISOString()
        });
        localStorage.setItem('users', JSON.stringify(users));
        localStorage.setItem('currentUser', JSON.stringify({ name: name, email: email }));

        // Show success notification
        toast.success('Account created successfully! Welcome ' + name + '! 🎉', 'Welcome!');

        // Disable button and redirect after delay
        var btn = document.getElementById('signupBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Redirecting...';

        setTimeout(function() {
            window.location.href = 'login.html';
        }, 2000);
    });

    // Remove error styling on input
    document.querySelectorAll('.field input').forEach(function(el) {
        el.addEventListener('input', function() { this.classList.remove('error'); });
    });
</script>
</body>
</html>
