<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - MarketStall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="supabase.js"></script>
    <style>
        /* Same styles as index */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f5f7fa; color: #0b1b2b; padding-bottom: 70px; }
        a { text-decoration: none; color: inherit; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

        /* Toast */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 380px; width: 90%; pointer-events: none; }
        .toast { background: #ffffff; border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); border-left: 4px solid #2a7de1; display: flex; align-items: center; gap: 12px; transform: translateX(120%); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: auto; position: relative; overflow: hidden; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.hide { transform: translateX(120%); opacity: 0; }
        .toast-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
        .toast-success .toast-icon { background: #d4edda; color: #155724; }
        .toast-error .toast-icon { background: #f8d7da; color: #721c24; }
        .toast-warning .toast-icon { background: #fff3cd; color: #856404; }
        .toast-info .toast-icon { background: #d1ecf1; color: #0c5460; }
        .toast-success { border-left-color: #28a745; }
        .toast-error { border-left-color: #dc3545; }
        .toast-warning { border-left-color: #ffc107; }
        .toast-info { border-left-color: #17a2b8; }
        .toast-content { flex: 1; }
        .toast-content .toast-title { font-weight: 600; font-size: 0.9rem; color: #0b1b2b; }
        .toast-content .toast-message { font-size: 0.82rem; color: #5b768b; }
        .toast-close { background: none; border: none; color: #999; cursor: pointer; font-size: 1.1rem; padding: 0 4px; }
        .toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; animation: toastProgress 4s linear forwards; }
        .toast-success .toast-progress { background: #28a745; }
        .toast-error .toast-progress { background: #dc3545; }
        .toast-warning .toast-progress { background: #ffc107; }
        .toast-info .toast-progress { background: #17a2b8; }
        @keyframes toastProgress { 0% { width: 100%; } 100% { width: 0%; } }

        /* Header */
        .header { position: sticky; top: 0; z-index: 100; background: #ffffff; padding: 12px 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border-bottom: 1px solid #eef2f6; }
        .header-top { display: flex; align-items: center; gap: 12px; max-width: 1280px; margin: 0 auto; }
        .logo { font-size: 1.3rem; font-weight: 700; color: #0b1b2b; flex-shrink: 0; }
        .logo i { color: #f8b400; }
        .logo span { color: #2a7de1; }
        .search-bar { flex: 1; display: flex; background: #f1f4f8; border-radius: 30px; overflow: hidden; height: 40px; max-width: 500px; }
        .search-bar input { flex: 1; border: none; background: transparent; padding: 0 16px; font-size: 0.85rem; outline: none; }
        .search-bar button { border: none; background: #f8b400; color: #0b1b2b; padding: 0 18px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
        .search-bar button:hover { background: #e0a000; }
        .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .header-actions a { color: #1f3a4b; font-size: 1.1rem; position: relative; padding: 4px 6px; transition: 0.2s; }
        .header-actions a:hover { color: #f8b400; }
        .cart-badge { position: absolute; top: -4px; right: -4px; background: #dc3545; color: #fff; border-radius: 50%; font-size: 0.55rem; font-weight: 700; padding: 1px 5px; min-width: 16px; text-align: center; }
        .btn-signup { background: #f8b400; color: #0b1b2b; padding: 4px 14px; border-radius: 30px; font-size: 0.75rem; font-weight: 600; transition: 0.2s; }
        .btn-signup:hover { background: #e0a000; transform: translateY(-2px); }
        .btn-logout { background: #dc3545; color: #fff; padding: 4px 14px; border-radius: 30px; border: none; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-logout:hover { background: #c82333; transform: translateY(-2px); }
        .user-greeting { font-size: 0.75rem; font-weight: 500; color: #1f3a4b; display: flex; align-items: center; gap: 4px; }
        .user-greeting i { color: #f8b400; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; display: flex; justify-content: space-around; align-items: center; padding: 6px 0 10px; box-shadow: 0 -2px 16px rgba(0,0,0,0.06); border-top: 1px solid #eef2f6; z-index: 999; height: 64px; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; color: #868e96; font-size: 0.6rem; font-weight: 500; transition: 0.2s; padding: 2px 8px; position: relative; min-width: 50px; }
        .bottom-nav a i { font-size: 1.2rem; margin-bottom: 2px; }
        .bottom-nav a:hover { color: #f8b400; }
        .bottom-nav a.active { color: #f8b400; }
        .bottom-nav a .nav-badge { position: absolute; top: -4px; right: 2px; background: #dc3545; color: #fff; border-radius: 50%; font-size: 0.5rem; font-weight: 700; padding: 1px 5px; min-width: 16px; text-align: center; }

        /* Profile */
        .page-header { margin: 16px 0 12px; }
        .page-header h1 { font-size: 1.2rem; font-weight: 700; }
        .page-header h1 i { color: #f8b400; margin-right: 6px; }

        .profile-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .profile-card { background: #ffffff; border-radius: 12px; border: 1px solid #eef2f6; padding: 16px; }
        .profile-card h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .profile-card h3 i { color: #f8b400; }

        .avatar-section { text-align: center; padding: 12px 0; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: #f1f4f8; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: #2a7de1; margin: 0 auto 8px; border: 3px solid #f8b400; }
        .avatar-section .name { font-weight: 700; font-size: 1rem; }
        .avatar-section .email { color: #5b768b; font-size: 0.85rem; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 500; font-size: 0.8rem; color: #1f3a4b; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 8px 14px; border: 1px solid #eef2f6; border-radius: 10px; font-size: 0.9rem; background: #f8f9fa; outline: none; transition: 0.2s; }
        .form-group input:focus { border-color: #f8b400; background: #ffffff; }
        .form-group input:disabled { background: #f1f4f8; color: #5b768b; cursor: not-allowed; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .btn-save { padding: 8px 24px; border: none; border-radius: 30px; font-weight: 600; font-size: 0.85rem; background: #2a7de1; color: #fff; cursor: pointer; transition: 0.2s; }
        .btn-save:hover { background: #1a5fb0; transform: translateY(-2px); }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: #f8f9fa; border-radius: 10px; padding: 12px; text-align: center; }
        .stat-box .number { font-size: 1.3rem; font-weight: 700; color: #0b1b2b; }
        .stat-box .label { font-size: 0.7rem; color: #5b768b; display: block; }

        .footer { background: #ffffff; border-radius: 12px; padding: 16px; margin: 8px 0 10px; border: 1px solid #eef2f6; text-align: center; }
        .footer .logo { font-size: 1rem; }
        .footer p { font-size: 0.65rem; color: #5b768b; margin-top: 4px; }
        .loading-spinner { display: flex; justify-content: center; align-items: center; padding: 40px 0; }
        .loading-spinner i { font-size: 2rem; color: #f8b400; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .login-prompt { text-align: center; padding: 40px 20px; background: #ffffff; border-radius: 12px; border: 1px solid #eef2f6; }
        .login-prompt i { font-size: 3rem; color: #dce5ed; margin-bottom: 12px; display: block; }
        .login-prompt h3 { font-size: 1rem; margin-bottom: 4px; }
        .login-prompt p { color: #5b768b; margin-bottom: 16px; }
        .login-prompt .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .login-prompt .btn-group a { padding: 8px 24px; border-radius: 30px; font-weight: 600; font-size: 0.85rem; text-decoration: none; display: inline-block; transition: 0.2s; }
        .login-prompt .btn-group .btn-primary { background: #2a7de1; color: #fff; }
        .login-prompt .btn-group .btn-primary:hover { background: #1a5fb0; transform: translateY(-2px); }
        .login-prompt .btn-group .btn-secondary { background: #f8f9fa; color: #1f3a4b; border: 1px solid #eef2f6; }
        .login-prompt .btn-group .btn-secondary:hover { background: #f1f4f8; transform: translateY(-2px); }

        @media (min-width: 640px) {
            body { padding-bottom: 0; }
            .bottom-nav { display: none; }
            .profile-grid { grid-template-columns: 280px 1fr; }
            .header { padding: 12px 24px; }
            .logo { font-size: 1.5rem; }
            .search-bar { height: 44px; }
            .search-bar input { font-size: 0.95rem; padding: 0 20px; }
            .search-bar button { padding: 0 24px; font-size: 0.95rem; }
            .page-header h1 { font-size: 1.4rem; }
            .profile-card { padding: 20px; }
        }
        @media (min-width: 1024px) {
            .container { padding: 0 24px; }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-top">
            <a href="index.html" class="logo"><i class="fas fa-store-alt"></i> Market<span>Stall</span></a>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search products...">
                <button onclick="searchProducts()"><i class="fas fa-search"></i></button>
            </div>
            <div class="header-actions">
                <a href="wishlist.html"><i class="fas fa-heart"></i></a>
                <a href="cart.html"><i class="fas fa-shopping-cart"></i> <span class="cart-badge" id="cartCount">0</span></a>
                <span id="authButtons"></span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-user"></i> My Profile</h1>
        </div>

        <div id="profileContent">
            <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
        </div>

        <footer class="footer">
            <a href="index.html" class="logo"><i class="fas fa-store-alt"></i> Market<span>Stall</span></a>
            <p>&copy; 2026 MarketStall Investments.</p>
        </footer>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <a href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="products.html"><i class="fas fa-th-list"></i><span>Products</span></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i><span>Cart</span><span class="nav-badge" id="bottomCartBadge">0</span></a>
        <a href="transactions.html"><i class="fas fa-receipt"></i><span>Orders</span></a>
        <a href="profile.html" class="active"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

    <script>
        // Toast system
        class ToastManager {
            constructor() { this.container = null; this.init(); }
            init() {
                if (!document.querySelector('.toast-container')) {
                    this.container = document.createElement('div');
                    this.container.className = 'toast-container';
                    document.body.appendChild(this.container);
                } else { this.container = document.querySelector('.toast-container'); }
            }
            show(message, options) {
                options = options || {};
                var type = options.type || 'info';
                var title = options.title || '';
                var duration = options.duration || 3000;
                var toast = document.createElement('div');
                toast.className = 'toast toast-' + type;
                var icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-circle', info: 'fa-info-circle' };
                var defaultTitles = { success: 'Success', error: 'Error', warning: 'Warning', info: 'Info' };
                var displayTitle = title || defaultTitles[type] || defaultTitles.info;
                toast.innerHTML =
                    '<div class="toast-icon"><i class="fas ' + icons[type] + '"></i></div>' +
                    '<div class="toast-content"><div class="toast-title">' + displayTitle + '</div><div class="toast-message">' + message + '</div></div>' +
                    '<button class="toast-close" onclick="this.closest(\'.toast\').remove()">&times;</button>' +
                    '<div class="toast-progress"></div>';
                this.container.appendChild(toast);
                setTimeout(function() { toast.classList.add('show'); }, 10);
                var timeout = setTimeout(function() {
                    if (toast.parentNode) {
                        toast.classList.remove('show');
                        toast.classList.add('hide');
                        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 400);
                    }
                }, duration);
                toast.addEventListener('click', function(e) {
                    if (e.target.closest('.toast-close')) return;
                    if (toast.parentNode) {
                        toast.classList.remove('show');
                        toast.classList.add('hide');
                        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 400);
                    }
                    clearTimeout(timeout);
                });
                return toast;
            }
            success(message, title) { return this.show(message, { type: 'success', title: title || '' }); }
            error(message, title) { return this.show(message, { type: 'error', title: title || '' }); }
            warning(message, title) { return this.show(message, { type: 'warning', title: title || '' }); }
            info(message, title) { return this.show(message, { type: 'info', title: title || '' }); }
        }
        window.toast = new ToastManager();

        // ============================================================
        // SUPABASE HELPERS
        // ============================================================
        function getSupabaseClient() { return window.supabaseClient || null; }
        function waitForSupabase() {
            return new Promise(function(resolve) {
                if (window.supabaseClient) { resolve(window.supabaseClient); return; }
                var checkInterval = setInterval(function() {
                    if (window.supabaseClient) { clearInterval(checkInterval); resolve(window.supabaseClient); }
                }, 200);
                setTimeout(function() { clearInterval(checkInterval); resolve(window.supabaseClient || null); }, 8000);
            });
        }

        // ============================================================
        // AUTH
        // ============================================================
        async function updateAuthButtons() {
            var authContainer = document.getElementById('authButtons');
            try {
                var client = getSupabaseClient();
                if (client) {
                    var { data: { session } } = await client.auth.getSession();
                    if (session) {
                        var email = session.user.email || 'User';
                        authContainer.innerHTML =
                            '<span class="user-greeting"><i class="fas fa-user-circle"></i> ' + email.split('@')[0] + '</span>' +
                            '<button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>';
                        return;
                    }
                }
            } catch (e) {}
            var currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser) {
                authContainer.innerHTML =
                    '<span class="user-greeting"><i class="fas fa-user-circle"></i> ' + (currentUser.name || 'User') + '</span>' +
                    '<button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>';
            } else {
                authContainer.innerHTML = '<a href="signup.html" class="btn-signup"><i class="fas fa-user-plus"></i> Sign Up</a>';
            }
        }

        window.logout = async function() {
            if (!confirm('Logout?')) return;
            try {
                var client = getSupabaseClient();
                if (client) { await client.auth.signOut(); }
                localStorage.removeItem('currentUser');
                updateAuthButtons();
                toast.success('Logged out.', 'Goodbye');
                setTimeout(function() { location.reload(); }, 500);
            } catch (e) { toast.error('Error logging out.', 'Error'); }
        };

        // ============================================================
        // CART
        // ============================================================
        function updateCartCount() {
            var cart = JSON.parse(localStorage.getItem('cart')) || [];
            var count = 0;
            for (var i = 0; i < cart.length; i++) { count += cart[i].quantity || 0; }
            var badge = document.getElementById('cartCount');
            if (badge) badge.textContent = count;
            var bottomBadge = document.getElementById('bottomCartBadge');
            if (bottomBadge) bottomBadge.textContent = count;
        }

        // ============================================================
        // PROFILE
        // ============================================================
        async function loadProfile() {
            var container = document.getElementById('profileContent');
            try {
                var client = getSupabaseClient();
                var user = null;
                var userEmail = null;

                if (client) {
                    var { data: { session } } = await client.auth.getSession();
                    if (session) {
                        user = session.user;
                        userEmail = user.email;
                    }
                }

                // Fallback to localStorage
                if (!userEmail) {
                    var currentUser = JSON.parse(localStorage.getItem('currentUser'));
                    if (currentUser) {
                        userEmail = currentUser.email;
                    }
                }

                if (!userEmail) {
                    container.innerHTML = `
                        <div class="login-prompt">
                            <i class="fas fa-user-circle"></i>
                            <h3>Not Logged In</h3>
                            <p>Please login to view your profile.</p>
                            <div class="btn-group">
                                <a href="login.html" class="btn-primary"><i class="fas fa-sign-in-alt"></i> Login</a>
                                <a href="signup.html" class="btn-secondary"><i class="fas fa-user-plus"></i> Sign Up</a>
                            </div>
                        </div>
                    `;
                    return;
                }

                // Get user data from localStorage or create default
                var users = JSON.parse(localStorage.getItem('users')) || [];
                var userData = null;
                for (var i = 0; i < users.length; i++) {
                    if (users[i].email === userEmail) { userData = users[i]; break; }
                }

                if (!userData) {
                    userData = { name: userEmail.split('@')[0], email: userEmail };
                    users.push(userData);
                    localStorage.setItem('users', JSON.stringify(users));
                }

                // Get orders
                var orders = JSON.parse(localStorage.getItem('orders')) || [];
                var totalOrders = orders.length;
                var totalSpent = 0;
                for (var j = 0; j < orders.length; j++) { totalSpent += (orders[j].total || 0); }

                // Get wishlist
                var wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

                container.innerHTML = `
                    <div class="profile-grid">
                        <div class="profile-card">
                            <div class="avatar-section">
                                <div class="avatar"><i class="fas fa-user-circle"></i></div>
                                <div class="name">${userData.name || 'User'}</div>
                                <div class="email"><i class="far fa-envelope"></i> ${userEmail}</div>
                            </div>
                            <div class="stat-grid">
                                <div class="stat-box"><div class="number">${totalOrders}</div><span class="label">Orders</span></div>
                                <div class="stat-box"><div class="number">$${totalSpent.toFixed(0)}</div><span class="label">Spent</span></div>
                                <div class="stat-box"><div class="number">${wishlist.length}</div><span class="label">Wishlist</span></div>
                                <div class="stat-box"><div class="number">${totalOrders > 0 ? orders.filter(o => o.status === 'Processing' || o.status === 'Shipped').length : 0}</div><span class="label">Pending</span></div>
                            </div>
                            <button class="btn-save" onclick="logout()" style="width:100%; margin-top:12px; background:#dc3545;"><i class="fas fa-sign-out-alt"></i> Logout</button>
                        </div>
                        <div>
                            <div class="profile-card">
                                <h3><i class="fas fa-user-edit"></i> Personal Information</h3>
                                <form id="profileForm">
                                    <div class="form-group">
                                        <label>Full Name</label>
                                        <input type="text" id="profileName" value="${userData.name || ''}" required>
                                    </div>
                                    <div class="form-group">
                                        <label>Email</label>
                                        <input type="email" id="profileEmail" value="${userEmail}" disabled>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>Phone</label>
                                            <input type="tel" id="profilePhone" value="${userData.phone || ''}" placeholder="+1 234 567 890">
                                        </div>
                                        <div class="form-group">
                                            <label>Date of Birth</label>
                                            <input type="date" id="profileDob" value="${userData.dob || ''}">
                                        </div>
                                    </div>
                                    <button type="submit" class="btn-save"><i class="fas fa-save"></i> Update Profile</button>
                                </form>
                            </div>
                            <div class="profile-card">
                                <h3><i class="fas fa-map-marker-alt"></i> Saved Addresses</h3>
                                <div id="addressesContainer">
                                    ${userData.addresses && userData.addresses.length > 0 ? userData.addresses.map(function(addr, idx) {
                                        return '<div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #eef2f6;"><span style="font-size:0.85rem;">' + addr + '</span><div><button onclick="editAddress(' + idx + ')" style="padding:2px 10px; border-radius:30px; border:1px solid #eef2f6; background:#f8f9fa; cursor:pointer; font-size:0.7rem;"><i class="fas fa-edit"></i></button> <button onclick="deleteAddress(' + idx + ')" style="padding:2px 10px; border-radius:30px; border:1px solid #dc3545; background:transparent; color:#dc3545; cursor:pointer; font-size:0.7rem;"><i class="fas fa-trash"></i></button></div></div>';
                                    }).join('') : '<p style="color:#5b768b; font-size:0.85rem;">No saved addresses.</p>'}
                                </div>
                                <button onclick="addAddress()" style="margin-top:8px; padding:6px 16px; border-radius:30px; border:1px solid #eef2f6; background:#f8f9fa; cursor:pointer; font-size:0.8rem;"><i class="fas fa-plus"></i> Add Address</button>
                            </div>
                        </div>
                    </div>
                `;

                // Form submit
                document.getElementById('profileForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    updateProfile();
                });

            } catch (e) {
                container.innerHTML = '<div class="login-prompt"><i class="fas fa-exclamation-circle"></i><h3>Error</h3><p>Could not load profile.</p></div>';
            }
        }

        // ============================================================
        // PROFILE ACTIONS
        // ============================================================
        window.updateProfile = function() {
            var name = document.getElementById('profileName').value.trim();
            if (!name) { toast.error('Please enter your name.', 'Error'); return; }

            var email = document.getElementById('profileEmail').value;
            var phone = document.getElementById('profilePhone').value.trim();
            var dob = document.getElementById('profileDob').value;

            var users = JSON.parse(localStorage.getItem('users')) || [];
            var updated = false;
            for (var i = 0; i < users.length; i++) {
                if (users[i].email === email) {
                    users[i].name = name;
                    users[i].phone = phone;
                    users[i].dob = dob;
                    updated = true;
                    break;
                }
            }
            if (!updated) {
                users.push({ name: name, email: email, phone: phone, dob: dob });
            }
            localStorage.setItem('users', JSON.stringify(users));
            localStorage.setItem('currentUser', JSON.stringify({ name: name, email: email }));

            toast.success('Profile updated!', 'Saved');
            loadProfile();
        };

        window.addAddress = function() {
            var address = prompt('Enter your address:');
            if (address && address.trim()) {
                var email = document.getElementById('profileEmail').value;
                var users = JSON.parse(localStorage.getItem('users')) || [];
                for (var i = 0; i < users.length; i++) {
                    if (users[i].email === email) {
                        if (!users[i].addresses) users[i].addresses = [];
                        users[i].addresses.push(address.trim());
                        localStorage.setItem('users', JSON.stringify(users));
                        toast.success('Address added!', 'Added');
                        loadProfile();
                        return;
                    }
                }
            }
        };

        window.editAddress = function(index) {
            var email = document.getElementById('profileEmail').value;
            var users = JSON.parse(localStorage.getItem('users')) || [];
            for (var i = 0; i < users.length; i++) {
                if (users[i].email === email && users[i].addresses && users[i].addresses[index]) {
                    var newAddress = prompt('Edit address:', users[i].addresses[index]);
                    if (newAddress && newAddress.trim()) {
                        users[i].addresses[index] = newAddress.trim();
                        localStorage.setItem('users', JSON.stringify(users));
                        toast.success('Address updated!', 'Updated');
                        loadProfile();
                    }
                    return;
                }
            }
        };

        window.deleteAddress = function(index) {
            if (!confirm('Delete this address?')) return;
            var email = document.getElementById('profileEmail').value;
            var users = JSON.parse(localStorage.getItem('users')) || [];
            for (var i = 0; i < users.length; i++) {
                if (users[i].email === email && users[i].addresses) {
                    users[i].addresses.splice(index, 1);
                    localStorage.setItem('users', JSON.stringify(users));
                    toast.success('Address deleted!', 'Deleted');
                    loadProfile();
                    return;
                }
            }
        };

        // ============================================================
        // SEARCH
        // ============================================================
        window.searchProducts = function() {
            var query = document.getElementById('searchInput').value.trim();
            if (query === '') { toast.info('Enter a search term.', 'Search'); return; }
            window.location.href = 'products.html?search=' + encodeURIComponent(query);
        };
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchProducts();
        });

        // ============================================================
        // INIT
        // ============================================================
        async function init() {
            var client = await waitForSupabase();
            if (client) { console.log('✅ Supabase connected'); } else { console.log('⚠️ Using fallback data'); }

            await updateAuthButtons();
            await loadProfile();
            updateCartCount();
            console.log('✅ Profile page loaded!');
        }

        document.addEventListener('DOMContentLoaded', init);
        document.addEventListener('supabaseReady', init);
    </script>
</body>
</html>
