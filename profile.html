<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - MarketStall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="supabase.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f5f7fa; color: #0b1b2b; padding-bottom: 70px; }
        a { text-decoration: none; color: inherit; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

        /* Toast */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 380px; width: 90%; pointer-events: none; }
        .toast { background: #ffffff; border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); border-left: 4px solid #2a7de1; display: flex; align-items: center; gap: 12px; transform: translateX(120%); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: auto; position: relative; overflow: hidden; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.hide { transform: translateX(120%); opacity: 0; }
        .toast-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
        .toast-success .toast-icon { background: #d4edda; color: #155724; }
        .toast-error .toast-icon { background: #f8d7da; color: #721c24; }
        .toast-warning .toast-icon { background: #fff3cd; color: #856404; }
        .toast-info .toast-icon { background: #d1ecf1; color: #0c5460; }
        .toast-success { border-left-color: #28a745; }
        .toast-error { border-left-color: #dc3545; }
        .toast-warning { border-left-color: #ffc107; }
        .toast-info { border-left-color: #17a2b8; }
        .toast-content { flex: 1; }
        .toast-content .toast-title { font-weight: 600; font-size: 0.9rem; color: #0b1b2b; }
        .toast-content .toast-message { font-size: 0.82rem; color: #5b768b; }
        .toast-close { background: none; border: none; color: #999; cursor: pointer; font-size: 1.1rem; padding: 0 4px; }
        .toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; animation: toastProgress 4s linear forwards; }
        .toast-success .toast-progress { background: #28a745; }
        .toast-error .toast-progress { background: #dc3545; }
        .toast-warning .toast-progress { background: #ffc107; }
        .toast-info .toast-progress { background: #17a2b8; }
        @keyframes toastProgress { 0% { width: 100%; } 100% { width: 0%; } }

        /* ===== HEADER ===== */
        .header { position: sticky; top: 0; z-index: 100; background: #ffffff; padding: 12px 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border-bottom: 1px solid #eef2f6; }
        .header-top { display: flex; align-items: center; gap: 12px; max-width: 1280px; margin: 0 auto; }
        .logo { font-size: 1.3rem; font-weight: 700; color: #0b1b2b; flex-shrink: 0; }
        .logo i { color: #f8b400; }
        .logo span { color: #2a7de1; }
        .search-bar { flex: 1; display: flex; background: #f1f4f8; border-radius: 30px; overflow: hidden; height: 40px; max-width: 500px; }
        .search-bar input { flex: 1; border: none; background: transparent; padding: 0 16px; font-size: 0.85rem; outline: none; }
        .search-bar button { border: none; background: #f8b400; color: #0b1b2b; padding: 0 18px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
        .search-bar button:hover { background: #e0a000; }

        .profile-menu { position: relative; display: inline-block; }
        .profile-btn { background: #f1f4f8; border: none; border-radius: 30px; padding: 6px 14px 6px 10px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; font-weight: 500; color: #1f3a4b; }
        .profile-btn:hover { background: #e3eaf2; }
        .profile-btn i { font-size: 1rem; color: #2a7de1; }
        .profile-btn .avatar-small { width: 28px; height: 28px; border-radius: 50%; background: #2a7de1; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 600; }
        .profile-btn .chevron { font-size: 0.6rem; color: #868e96; margin-left: 2px; }

        .profile-dropdown { display: none; position: absolute; right: 0; top: 44px; background: #ffffff; min-width: 200px; border-radius: 12px; border: 1px solid #eef2f6; box-shadow: 0 8px 32px rgba(0,0,0,0.1); z-index: 200; padding: 6px 0; overflow: hidden; }
        .profile-dropdown.show { display: block; }
        .profile-dropdown .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: #1f3a4b; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: 0.2s; text-decoration: none; border: none; background: none; width: 100%; text-align: left; }
        .profile-dropdown .dropdown-item:hover { background: #f1f4f8; }
        .profile-dropdown .dropdown-item i { width: 20px; color: #5b768b; font-size: 0.95rem; }
        .profile-dropdown .dropdown-divider { height: 1px; background: #eef2f6; margin: 4px 12px; }
        .profile-dropdown .dropdown-item.logout { color: #dc3545; }
        .profile-dropdown .dropdown-item.logout i { color: #dc3545; }
        .profile-dropdown .dropdown-item .badge { background: #dc3545; color: #fff; border-radius: 50%; font-size: 0.6rem; padding: 1px 6px; margin-left: auto; }
        .profile-dropdown .user-info { padding: 12px 16px 8px; border-bottom: 1px solid #eef2f6; }
        .profile-dropdown .user-info .name { font-weight: 600; font-size: 0.9rem; }
        .profile-dropdown .user-info .email { font-size: 0.75rem; color: #5b768b; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; display: flex; justify-content: space-around; align-items: center; padding: 6px 0 10px; box-shadow: 0 -2px 16px rgba(0,0,0,0.06); border-top: 1px solid #eef2f6; z-index: 999; height: 64px; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; color: #868e96; font-size: 0.6rem; font-weight: 500; transition: 0.2s; padding: 2px 8px; position: relative; min-width: 50px; }
        .bottom-nav a i { font-size: 1.2rem; margin-bottom: 2px; }
        .bottom-nav a:hover { color: #f8b400; }
        .bottom-nav a.active { color: #f8b400; }
        .bottom-nav a .nav-badge { position: absolute; top: -4px; right: 2px; background: #dc3545; color: #fff; border-radius: 50%; font-size: 0.5rem; font-weight: 700; padding: 1px 5px; min-width: 16px; text-align: center; }

        /* ===== PROFILE ===== */
        .page-header { margin: 16px 0 12px; }
        .page-header h1 { font-size: 1.2rem; font-weight: 700; }
        .page-header h1 i { color: #f8b400; margin-right: 6px; }

        .profile-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }

        /* Profile Sidebar */
        .profile-sidebar { 
            background: #ffffff; 
            border-radius: 16px; 
            border: 1px solid #eef2f6; 
            padding: 24px 20px; 
            text-align: center;
            height: fit-content;
            position: sticky;
            top: 80px;
        }
        .profile-avatar { 
            position: relative; 
            width: 120px; 
            height: 120px; 
            margin: 0 auto 16px; 
            border-radius: 50%; 
            background: #f1f4f8; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 4rem; 
            color: #2a7de1;
            border: 4px solid #f8b400;
            overflow: hidden;
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-avatar .avatar-placeholder { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            height: 100%; 
            background: #f1f4f8;
        }
        .avatar-upload-btn { 
            position: absolute; 
            bottom: 4px; 
            right: 4px; 
            background: #f8b400; 
            color: #0b1b2b; 
            border: none; 
            border-radius: 50%; 
            width: 36px; 
            height: 36px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.9rem;
            transition: 0.2s;
            border: 2px solid #fff;
        }
        .avatar-upload-btn:hover { background: #e0a000; transform: scale(1.05); }
        .profile-sidebar .name { font-weight: 700; font-size: 1.1rem; margin-top: 4px; }
        .profile-sidebar .email { color: #5b768b; font-size: 0.85rem; }
        .profile-sidebar .member-since { color: #999; font-size: 0.75rem; margin-top: 4px; }

        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            margin: 16px 0; 
        }
        .stat-box { 
            background: #f8f9fa; 
            border-radius: 12px; 
            padding: 12px 8px; 
            text-align: center;
        }
        .stat-box .number { font-size: 1.2rem; font-weight: 700; color: #0b1b2b; }
        .stat-box .label { font-size: 0.65rem; color: #5b768b; display: block; margin-top: 2px; }

        .sidebar-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .sidebar-buttons .btn-logout { 
            background: #dc3545; 
            color: #fff; 
            border: none; 
            padding: 10px 0; 
            border-radius: 30px; 
            font-weight: 600; 
            font-size: 0.85rem; 
            cursor: pointer; 
            transition: 0.2s; 
            width: 100%;
        }
        .sidebar-buttons .btn-logout:hover { background: #c82333; transform: translateY(-2px); }

        /* Profile Content */
        .profile-content { display: flex; flex-direction: column; gap: 16px; }
        .profile-card { 
            background: #ffffff; 
            border-radius: 16px; 
            border: 1px solid #eef2f6; 
            padding: 20px 24px; 
        }
        .profile-card .card-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 16px; 
            padding-bottom: 12px; 
            border-bottom: 1px solid #eef2f6;
        }
        .profile-card .card-header h3 { 
            font-size: 1rem; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .profile-card .card-header h3 i { color: #f8b400; }
        .profile-card .card-header .edit-btn { 
            background: none; 
            border: none; 
            color: #2a7de1; 
            font-size: 0.8rem; 
            cursor: pointer; 
            font-weight: 500; 
            padding: 4px 12px; 
            border-radius: 30px; 
            transition: 0.2s;
        }
        .profile-card .card-header .edit-btn:hover { background: #f1f4f8; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 500; font-size: 0.8rem; color: #1f3a4b; margin-bottom: 4px; }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 8px 14px; 
            border: 1px solid #eef2f6; 
            border-radius: 10px; 
            font-size: 0.9rem; 
            background: #f8f9fa; 
            outline: none; 
            transition: 0.2s; 
        }
        .form-group input:focus, .form-group select:focus { 
            border-color: #f8b400; 
            background: #ffffff; 
            box-shadow: 0 0 0 4px rgba(248,180,0,0.08); 
        }
        .form-group input:disabled { 
            background: #f1f4f8; 
            color: #5b768b; 
            cursor: not-allowed; 
        }
        .form-group input.error { border-color: #dc3545; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-save { 
            padding: 8px 24px; 
            border: none; 
            border-radius: 30px; 
            font-weight: 600; 
            font-size: 0.85rem; 
            background: #2a7de1; 
            color: #fff; 
            cursor: pointer; 
            transition: 0.2s; 
            margin-top: 4px;
        }
        .btn-save:hover { background: #1a5fb0; transform: translateY(-2px); }
        .btn-save i { margin-right: 6px; }

        .address-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 0; 
            border-bottom: 1px solid #eef2f6; 
        }
        .address-item:last-child { border-bottom: none; }
        .address-item .address-text { font-size: 0.85rem; color: #1f3a4b; }
        .address-item .address-text .default-badge { 
            background: #28a745; 
            color: #fff; 
            font-size: 0.55rem; 
            padding: 1px 8px; 
            border-radius: 30px; 
            margin-left: 8px; 
        }
        .address-item .address-actions { display: flex; gap: 6px; }
        .address-item .address-actions button { 
            padding: 2px 10px; 
            border-radius: 30px; 
            border: 1px solid #eef2f6; 
            background: #f8f9fa; 
            cursor: pointer; 
            font-size: 0.7rem; 
            transition: 0.2s; 
        }
        .address-item .address-actions button:hover { background: #f1f4f8; }
        .address-item .address-actions .delete-btn { color: #dc3545; border-color: #dc3545; }
        .address-item .address-actions .delete-btn:hover { background: #dc3545; color: #fff; }

        .btn-add-address { 
            padding: 6px 16px; 
            border-radius: 30px; 
            border: 1px solid #eef2f6; 
            background: #f8f9fa; 
            cursor: pointer; 
            font-size: 0.8rem; 
            font-weight: 500; 
            transition: 0.2s; 
            margin-top: 8px;
        }
        .btn-add-address:hover { background: #f1f4f8; }

        .wishlist-preview { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .wishlist-item { 
            background: #f8f9fa; 
            border-radius: 10px; 
            padding: 12px; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        .wishlist-item .icon { font-size: 1.6rem; color: #2a7de1; margin-bottom: 4px; }
        .wishlist-item .wish-name { font-size: 0.75rem; font-weight: 500; }
        .wishlist-item .wish-price { font-size: 0.8rem; font-weight: 700; color: #2a7de1; }

        .order-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 8px 0; 
            border-bottom: 1px solid #eef2f6; 
        }
        .order-row:last-child { border-bottom: none; }
        .order-row .order-info { flex: 1; }
        .order-row .order-id { font-weight: 600; font-size: 0.85rem; }
        .order-row .order-date { font-size: 0.7rem; color: #5b768b; display: block; }
        .order-row .order-status { 
            padding: 2px 12px; 
            border-radius: 30px; 
            font-size: 0.65rem; 
            font-weight: 600; 
        }
        .order-status-pending { background: #fff3cd; color: #856404; }
        .order-status-processing { background: #fef3e6; color: #a8641a; }
        .order-status-shipped { background: #e6f0fa; color: #1f5680; }
        .order-status-delivered { background: #e6f3e6; color: #0f5c3a; }
        .order-status-cancelled { background: #fde8e8; color: #dc3545; }

        .view-all-link { 
            display: inline-block; 
            margin-top: 8px; 
            color: #2a7de1; 
            font-size: 0.8rem; 
            font-weight: 500; 
            text-decoration: none; 
        }
        .view-all-link:hover { text-decoration: underline; }

        .empty-state-mini { 
            color: #5b768b; 
            font-size: 0.85rem; 
            padding: 8px 0; 
        }

        .login-prompt { text-align: center; padding: 60px 20px; background: #ffffff; border-radius: 16px; border: 1px solid #eef2f6; }
        .login-prompt i { font-size: 3.5rem; color: #dce5ed; margin-bottom: 16px; display: block; }
        .login-prompt h3 { font-size: 1.2rem; margin-bottom: 4px; }
        .login-prompt p { color: #5b768b; margin-bottom: 20px; }
        .login-prompt .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .login-prompt .btn-group a { 
            padding: 10px 32px; 
            border-radius: 30px; 
            font-weight: 600; 
            font-size: 0.9rem; 
            text-decoration: none; 
            display: inline-block; 
            transition: 0.2s; 
        }
        .login-prompt .btn-group .btn-primary { background: #2a7de1; color: #fff; }
        .login-prompt .btn-group .btn-primary:hover { background: #1a5fb0; transform: translateY(-2px); }
        .login-prompt .btn-group .btn-secondary { background: #f8f9fa; color: #1f3a4b; border: 1px solid #eef2f6; }
        .login-prompt .btn-group .btn-secondary:hover { background: #f1f4f8; transform: translateY(-2px); }

        .footer { background: #ffffff; border-radius: 12px; padding: 16px; margin: 8px 0 10px; border: 1px solid #eef2f6; text-align: center; }
        .footer .logo { font-size: 1rem; }
        .footer p { font-size: 0.65rem; color: #5b768b; margin-top: 4px; }
        .loading-spinner { display: flex; justify-content: center; align-items: center; padding: 40px 0; }
        .loading-spinner i { font-size: 2rem; color: #f8b400; animation: spin 1s linear infinite; }

        @media (min-width: 640px) {
            body { padding-bottom: 0; }
            .bottom-nav { display: none; }
            .header { padding: 12px 24px; }
            .logo { font-size: 1.5rem; }
            .search-bar { height: 44px; }
            .search-bar input { font-size: 0.95rem; padding: 0 20px; }
            .search-bar button { padding: 0 24px; font-size: 0.95rem; }
            .page-header h1 { font-size: 1.4rem; }
            .profile-grid { grid-template-columns: 280px 1fr; }
            .profile-avatar { width: 140px; height: 140px; font-size: 4.5rem; }
            .wishlist-preview { grid-template-columns: repeat(2, 1fr); }
        }
        @media (min-width: 1024px) {
            .container { padding: 0 24px; }
            .profile-grid { grid-template-columns: 300px 1fr; gap: 24px; }
            .profile-sidebar { padding: 32px 24px; }
        }
        @media (max-width: 640px) {
            .profile-grid { grid-template-columns: 1fr; }
            .profile-sidebar { position: static; }
            .form-row { grid-template-columns: 1fr; }
            .wishlist-preview { grid-template-columns: 1fr 1fr; }
            .profile-avatar { width: 100px; height: 100px; font-size: 3.5rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-top">
            <a href="index.html" class="logo"><i class="fas fa-store-alt"></i> Market<span>Stall</span></a>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search products...">
                <button onclick="searchProducts()"><i class="fas fa-search"></i></button>
            </div>
            <div class="profile-menu">
                <button class="profile-btn" onclick="toggleProfileMenu()">
                    <span class="avatar-small" id="avatarLetter">U</span>
                    <span id="profileName">Account</span>
                    <i class="fas fa-chevron-down chevron"></i>
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="user-info"><div class="name" id="dropdownName">User</div><div class="email" id="dropdownEmail">user@example.com</div></div>
                    <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i> My Profile</a>
                    <a href="wishlist.html" class="dropdown-item"><i class="fas fa-heart"></i> Wishlist</a>
                    <a href="cart.html" class="dropdown-item"><i class="fas fa-shopping-cart"></i> Cart <span class="badge" id="dropdownCartBadge">0</span></a>
                    <a href="transactions.html" class="dropdown-item"><i class="fas fa-receipt"></i> Orders</a>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    <a href="signup.html" class="dropdown-item" id="signupLink"><i class="fas fa-user-plus"></i> Sign Up</a>
                    <a href="login.html" class="dropdown-item" id="loginLink"><i class="fas fa-sign-in-alt"></i> Login</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-user"></i> My Profile</h1>
        </div>

        <div id="profileContent">
            <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
        </div>

        <footer class="footer">
            <a href="index.html" class="logo"><i class="fas fa-store-alt"></i> Market<span>Stall</span></a>
            <p>&copy; 2026 MarketStall Investments.</p>
        </footer>
    </div>

    <nav class="bottom-nav">
        <a href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="products.html"><i class="fas fa-th-list"></i><span>Products</span></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i><span>Cart</span><span class="nav-badge" id="bottomCartBadge">0</span></a>
        <a href="transactions.html"><i class="fas fa-receipt"></i><span>Orders</span></a>
        <a href="profile.html" class="active"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

    <script>
        // ===== TOAST =====
        class ToastManager {
            constructor() { this.container = null; this.init(); }
            init() {
                if (!document.querySelector('.toast-container')) {
                    this.container = document.createElement('div');
                    this.container.className = 'toast-container';
                    document.body.appendChild(this.container);
                } else { this.container = document.querySelector('.toast-container'); }
            }
            show(message, options) {
                options = options || {};
                var type = options.type || 'info';
                var title = options.title || '';
                var duration = options.duration || 4000;
                var toast = document.createElement('div');
                toast.className = 'toast toast-' + type;
                var icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-circle', info: 'fa-info-circle' };
                var defaultTitles = { success: 'Success', error: 'Error', warning: 'Warning', info: 'Info' };
                var displayTitle = title || defaultTitles[type] || defaultTitles.info;
                toast.innerHTML =
                    '<div class="toast-icon"><i class="fas ' + icons[type] + '"></i></div>' +
                    '<div class="toast-content"><div class="toast-title">' + displayTitle + '</div><div class="toast-message">' + message + '</div></div>' +
                    '<button class="toast-close" onclick="this.closest(\'.toast\').remove()">&times;</button>' +
                    '<div class="toast-progress"></div>';
                this.container.appendChild(toast);
                setTimeout(function() { toast.classList.add('show'); }, 10);
                var timeout = setTimeout(function() {
                    if (toast.parentNode) {
                        toast.classList.remove('show');
                        toast.classList.add('hide');
                        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 400);
                    }
                }, duration);
                toast.addEventListener('click', function(e) {
                    if (e.target.closest('.toast-close')) return;
                    if (toast.parentNode) {
                        toast.classList.remove('show');
                        toast.classList.add('hide');
                        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 400);
                    }
                    clearTimeout(timeout);
                });
                return toast;
            }
            success(message, title) { return this.show(message, { type: 'success', title: title || '' }); }
            error(message, title) { return this.show(message, { type: 'error', title: title || '' }); }
            warning(message, title) { return this.show(message, { type: 'warning', title: title || '' }); }
            info(message, title) { return this.show(message, { type: 'info', title: title || '' }); }
        }
        window.toast = new ToastManager();

        // ===== PROFILE =====
        function toggleProfileMenu() {
            document.getElementById('profileDropdown').classList.toggle('show');
        }
        document.addEventListener('click', function(e) {
            var menu = document.querySelector('.profile-menu');
            if (menu && !menu.contains(e.target)) {
                document.getElementById('profileDropdown').classList.remove('show');
            }
        });

        function updateProfileUI() {
            var currentUser = JSON.parse(localStorage.getItem('currentUser'));
            var dropdown = document.getElementById('profileDropdown');
            var signupLink = document.getElementById('signupLink');
            var loginLink = document.getElementById('loginLink');

            if (currentUser) {
                var name = currentUser.name || 'User';
                var email = currentUser.email || 'user@example.com';
                var initial = name.charAt(0).toUpperCase();

                document.getElementById('avatarLetter').textContent = initial;
                document.getElementById('profileName').textContent = name.split(' ')[0];
                document.getElementById('dropdownName').textContent = name;
                document.getElementById('dropdownEmail').textContent = email;

                signupLink.style.display = 'none';
                loginLink.style.display = 'none';
                var logoutBtn = dropdown.querySelector('.dropdown-item.logout');
                if (logoutBtn) logoutBtn.style.display = 'flex';
            } else {
                document.getElementById('avatarLetter').textContent = 'U';
                document.getElementById('profileName').textContent = 'Account';
                document.getElementById('dropdownName').textContent = 'Not Logged In';
                document.getElementById('dropdownEmail').textContent = 'Please sign in';

                signupLink.style.display = 'flex';
                loginLink.style.display = 'flex';
                var logoutBtn = dropdown.querySelector('.dropdown-item.logout');
                if (logoutBtn) logoutBtn.style.display = 'none';
            }
        }

        window.logout = async function() {
            if (!confirm('Logout?')) return;
            try {
                var client = getSupabaseClient();
                if (client) { await client.auth.signOut(); }
                localStorage.removeItem('currentUser');
                updateProfileUI();
                updateCartCount();
                toast.success('Logged out.', 'Goodbye');
                setTimeout(function() { location.reload(); }, 500);
            } catch (e) { toast.error('Error logging out.', 'Error'); }
        };

        function getSupabaseClient() { return window.supabaseClient || null; }
        function waitForSupabase() {
            return new Promise(function(resolve) {
                if (window.supabaseClient) { resolve(window.supabaseClient); return; }
                var checkInterval = setInterval(function() {
                    if (window.supabaseClient) { clearInterval(checkInterval); resolve(window.supabaseClient); }
                }, 200);
                setTimeout(function() { clearInterval(checkInterval); resolve(window.supabaseClient || null); }, 8000);
            });
        }

        // ===== CART =====
        function updateCartCount() {
            var cart = JSON.parse(localStorage.getItem('cart')) || [];
            var count = 0;
            for (var i = 0; i < cart.length; i++) { count += cart[i].quantity || 0; }
            var badge = document.getElementById('dropdownCartBadge');
            if (badge) badge.textContent = count;
            var bottomBadge = document.getElementById('bottomCartBadge');
            if (bottomBadge) bottomBadge.textContent = count;
        }

        // ===== SEARCH =====
        window.searchProducts = function() {
            var query = document.getElementById('searchInput').value.trim();
            if (query === '') { toast.info('Enter a search term.', 'Search'); return; }
            window.location.href = 'products.html?search=' + encodeURIComponent(query);
        };
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchProducts();
        });

        // ===== PROFILE DATA =====
        function getStatusClass(status) {
            var map = {
                'Pending': 'order-status-pending',
                'Processing': 'order-status-processing',
                'Shipped': 'order-status-shipped',
                'Delivered': 'order-status-delivered',
                'Cancelled': 'order-status-cancelled'
            };
            return map[status] || 'order-status-processing';
        }

        function loadProfile() {
            var container = document.getElementById('profileContent');
            var currentUser = JSON.parse(localStorage.getItem('currentUser'));

            if (!currentUser) {
                container.innerHTML = `
                    <div class="login-prompt">
                        <i class="fas fa-user-circle"></i>
                        <h3>Not Logged In</h3>
                        <p>Please login to view your profile.</p>
                        <div class="btn-group">
                            <a href="login.html" class="btn-primary"><i class="fas fa-sign-in-alt"></i> Login</a>
                            <a href="signup.html" class="btn-secondary"><i class="fas fa-user-plus"></i> Sign Up</a>
                        </div>
                    </div>
                `;
                return;
            }

            var name = currentUser.name || 'User';
            var email = currentUser.email || 'user@example.com';
            var initial = name.charAt(0).toUpperCase();

            // Get orders
            var orders = JSON.parse(localStorage.getItem('orders')) || [];
            var totalOrders = orders.length;
            var totalSpent = 0;
            for (var j = 0; j < orders.length; j++) { totalSpent += (orders[j].total || 0); }
            var pendingOrders = orders.filter(function(o) { 
                return o.status === 'Pending' || o.status === 'Processing' || o.status === 'Shipped'; 
            }).length;

            // Get wishlist
            var wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

            // Get user data for addresses
            var users = JSON.parse(localStorage.getItem('users')) || [];
            var userData = null;
            for (var i = 0; i < users.length; i++) {
                if (users[i].email === email) { userData = users[i]; break; }
            }

            var addresses = (userData && userData.addresses) || [];
            var phone = (userData && userData.phone) || '';
            var dob = (userData && userData.dob) || '';

            // Build addresses HTML
            var addressesHtml = '';
            if (addresses.length > 0) {
                for (var a = 0; a < addresses.length; a++) {
                    var isDefault = a === 0;
                    addressesHtml += `
                        <div class="address-item">
                            <div class="address-text">
                                ${addresses[a]}
                                ${isDefault ? '<span class="default-badge">Default</span>' : ''}
                            </div>
                            <div class="address-actions">
                                <button onclick="editAddress(${a})"><i class="fas fa-edit"></i></button>
                                <button class="delete-btn" onclick="deleteAddress(${a})"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                }
            } else {
                addressesHtml = '<div class="empty-state-mini">No saved addresses.</div>';
            }

            // Build wishlist HTML
            var wishlistHtml = '';
            if (wishlist.length > 0) {
                var displayItems = wishlist.slice(0, 4);
                wishlistHtml = '<div class="wishlist-preview">';
                for (var w = 0; w < displayItems.length; w++) {
                    var item = displayItems[w];
                    wishlistHtml += `
                        <div class="wishlist-item">
                            <div class="icon"><i class="fas ${item.image || 'fa-heart'}"></i></div>
                            <div class="wish-name">${item.name}</div>
                            <div class="wish-price">$${parseFloat(item.price).toFixed(2)}</div>
                        </div>
                    `;
                }
                wishlistHtml += '</div>';
                if (wishlist.length > 4) {
                    wishlistHtml += '<a href="wishlist.html" class="view-all-link">View all ' + wishlist.length + ' items →</a>';
                }
            } else {
                wishlistHtml = '<div class="empty-state-mini">Your wishlist is empty.</div>';
            }

            // Build orders HTML
            var ordersHtml = '';
            if (orders.length > 0) {
                var recentOrders = orders.slice(-3);
                for (var o = 0; o < recentOrders.length; o++) {
                    var order = recentOrders[o];
                    var statusClass = getStatusClass(order.status);
                    var orderNumber = order.order_number || order.id || 'N/A';
                    var orderDate = order.date || order.created_at ? new Date(order.created_at).toLocaleDateString() : 'N/A';
                    ordersHtml += `
                        <div class="order-row">
                            <div class="order-info">
                                <span class="order-id">#${orderNumber}</span>
                                <span class="order-date">${orderDate}</span>
                            </div>
                            <div>
                                <span style="font-weight:600; margin-right:12px; font-size:0.85rem;">$${(order.total || 0).toFixed(2)}</span>
                                <span class="order-status ${statusClass}">${order.status || 'Processing'}</span>
                            </div>
                        </div>
                    `;
                }
                ordersHtml += '<a href="transactions.html" class="view-all-link">View all orders →</a>';
            } else {
                ordersHtml = '<div class="empty-state-mini">No orders yet.</div>';
            }

            container.innerHTML = `
                <div class="profile-grid">
                    <!-- Sidebar -->
                    <div class="profile-sidebar">
                        <div class="profile-avatar">
                            <div class="avatar-placeholder" id="avatarPlaceholder">
                                <i class="fas fa-user-circle"></i>
                            </div>
                            <button class="avatar-upload-btn" onclick="uploadProfilePicture()" title="Upload profile picture">
                                <i class="fas fa-camera"></i>
                            </button>
                            <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
                        </div>
                        <div class="name">${name}</div>
                        <div class="email"><i class="far fa-envelope"></i> ${email}</div>
                        <div class="member-since"><i class="far fa-calendar-alt"></i> Member since 2026</div>

                        <div class="stats-grid">
                            <div class="stat-box"><div class="number">${totalOrders}</div><span class="label">Orders</span></div>
                            <div class="stat-box"><div class="number">$${totalSpent.toFixed(0)}</div><span class="label">Spent</span></div>
                            <div class="stat-box"><div class="number">${wishlist.length}</div><span class="label">Wishlist</span></div>
                            <div class="stat-box"><div class="number">${pendingOrders}</div><span class="label">Pending</span></div>
                        </div>

                        <div class="sidebar-buttons">
                            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                        </div>
                    </div>

                    <!-- Content -->
                    <div class="profile-content">
                        <!-- Personal Information -->
                        <div class="profile-card">
                            <div class="card-header">
                                <h3><i class="fas fa-user-edit"></i> Personal Information</h3>
                                <button class="edit-btn" onclick="toggleEdit()"><i class="fas fa-pen"></i> Edit</button>
                            </div>
                            <form id="profileForm">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>Full Name *</label>
                                        <input type="text" id="profileNameInput" value="${name}" disabled>
                                    </div>
                                    <div class="form-group">
                                        <label>Email</label>
                                        <input type="email" id="profileEmail" value="${email}" disabled>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>Phone Number</label>
                                        <input type="tel" id="profilePhone" value="${phone}" placeholder="+1 234 567 890" disabled>
                                    </div>
                                    <div class="form-group">
                                        <label>Date of Birth</label>
                                        <input type="date" id="profileDob" value="${dob}" disabled>
                                    </div>
                                </div>
                                <div class="form-group" style="display:none;" id="saveButtonContainer">
                                    <button type="submit" class="btn-save"><i class="fas fa-save"></i> Save Changes</button>
                                </div>
                            </form>
                        </div>

                        <!-- Saved Addresses -->
                        <div class="profile-card">
                            <div class="card-header">
                                <h3><i class="fas fa-map-marker-alt"></i> Saved Addresses</h3>
                                <button class="edit-btn" onclick="addAddress()"><i class="fas fa-plus"></i> Add Address</button>
                            </div>
                            <div id="addressesContainer">${addressesHtml}</div>
                        </div>

                        <!-- Wishlist -->
                        <div class="profile-card">
                            <div class="card-header">
                                <h3><i class="fas fa-heart"></i> Wishlist</h3>
                                <a href="wishlist.html" class="edit-btn">View All</a>
                            </div>
                            ${wishlistHtml}
                        </div>

                        <!-- Recent Orders -->
                        <div class="profile-card">
                            <div class="card-header">
                                <h3><i class="fas fa-receipt"></i> Recent Orders</h3>
                                <a href="transactions.html" class="edit-btn">View All</a>
                            </div>
                            ${ordersHtml}
                        </div>
                    </div>
                </div>
            `;

            // Attach form submit
            document.getElementById('profileForm').addEventListener('submit', function(e) {
                e.preventDefault();
                updateProfile();
            });
        }

        // ===== PROFILE ACTIONS =====
        var isEditing = false;

        window.toggleEdit = function() {
            isEditing = !isEditing;
            var inputs = document.querySelectorAll('#profileForm input:not([disabled])');
            var saveBtn = document.getElementById('saveButtonContainer');
            
            if (isEditing) {
                document.getElementById('profileNameInput').disabled = false;
                document.getElementById('profilePhone').disabled = false;
                document.getElementById('profileDob').disabled = false;
                saveBtn.style.display = 'block';
                toast.info('Edit mode enabled. Make your changes and save.', 'Editing');
            } else {
                document.getElementById('profileNameInput').disabled = true;
                document.getElementById('profilePhone').disabled = true;
                document.getElementById('profileDob').disabled = true;
                saveBtn.style.display = 'none';
            }
        };

        window.updateProfile = function() {
            var name = document.getElementById('profileNameInput').value.trim();
            if (!name) {
                toast.error('Please enter your name.', 'Error');
                return;
            }

            var email = document.getElementById('profileEmail').value;
            var phone = document.getElementById('profilePhone').value.trim();
            var dob = document.getElementById('profileDob').value;

            // Update in localStorage
            var users = JSON.parse(localStorage.getItem('users')) || [];
            var updated = false;
            for (var i = 0; i < users.length; i++) {
                if (users[i].email === email) {
                    users[i].name = name;
                    users[i].phone = phone;
                    users[i].dob = dob;
                    updated = true;
                    break;
                }
            }
            if (!updated) {
                users.push({ name: name, email: email, phone: phone, dob: dob });
            }
            localStorage.setItem('users', JSON.stringify(users));

            // Update current user
            var currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser) {
                currentUser.name = name;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
            }

            toast.success('Profile updated successfully!', 'Saved');
            isEditing = false;
            document.getElementById('profileNameInput').disabled = true;
            document.getElementById('profilePhone').disabled = true;
            document.getElementById('profileDob').disabled = true;
            document.getElementById('saveButtonContainer').style.display = 'none';
            
            // Reload profile
            loadProfile();
            updateProfileUI();
        };

        window.addAddress = function() {
            var address = prompt('Enter your address:');
            if (address && address.trim()) {
                var email = document.getElementById('profileEmail').value;
                var users = JSON.parse(localStorage.getItem('users')) || [];
                for (var i = 0; i < users.length; i++) {
                    if (users[i].email === email) {
                        if (!users[i].addresses) users[i].addresses = [];
                        users[i].addresses.push(address.trim());
                        localStorage.setItem('users', JSON.stringify(users));
                        toast.success('Address added!', 'Added');
                        loadProfile();
                        return;
                    }
                }
            }
        };

        window.editAddress = function(index) {
            var email = document.getElementById('profileEmail').value;
            var users = JSON.parse(localStorage.getItem('users')) || [];
            for (var i = 0; i < users.length; i++) {
                if (users[i].email === email && users[i].addresses && users[i].addresses[index]) {
                    var newAddress = prompt('Edit address:', users[i].addresses[index]);
                    if (newAddress && newAddress.trim()) {
                        users[i].addresses[index] = newAddress.trim();
                        localStorage.setItem('users', JSON.stringify(users));
                        toast.success('Address updated!', 'Updated');
                        loadProfile();
                    }
                    return;
                }
            }
        };

        window.deleteAddress = function(index) {
            if (!confirm('Delete this address?')) return;
            var email = document.getElementById('profileEmail').value;
            var users = JSON.parse(localStorage.getItem('users')) || [];
            for (var i = 0; i < users.length; i++) {
                if (users[i].email === email && users[i].addresses) {
                    users[i].addresses.splice(index, 1);
                    localStorage.setItem('users', JSON.stringify(users));
                    toast.success('Address deleted!', 'Deleted');
                    loadProfile();
                    return;
                }
            }
        };

        window.uploadProfilePicture = function() {
            document.getElementById('avatarInput').click();
        };

        window.handleAvatarUpload = function(event) {
            var file = event.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                var avatarPlaceholder = document.getElementById('avatarPlaceholder');
                avatarPlaceholder.innerHTML = '<img src="' + e.target.result + '" alt="Profile picture" style="width:100%;height:100%;object-fit:cover;">';
                toast.success('Profile picture updated!', 'Updated');
            };
            reader.readAsDataURL(file);
            
            // Reset input for next upload
            document.getElementById('avatarInput').value = '';
        };

        // ===== INIT =====
        async function init() {
            var client = await waitForSupabase();
            if (client) { console.log('✅ Supabase connected'); } else { console.log('⚠️ Using fallback data'); }

            updateProfileUI();
            loadProfile();
            updateCartCount();
            console.log('✅ Profile page loaded!');
        }

        document.addEventListener('DOMContentLoaded', init);
        document.addEventListener('supabaseReady', init);
    </script>
</body>
</html>
