        /* ===== GLOBAL STYLES ===== */
        :root {
            --primary: #2a7de1;
            --primary-dark: #1a5fb0;
            --secondary: #f8b400;
            --accent: #ff6b35;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --info: #17a2b8;
            --dark: #0b1b2b;
            --light: #f5f7fa;
            --gray: #5b768b;
        }

        /* ===== TOAST NOTIFICATIONS ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 420px;
            width: 100%;
            pointer-events: none;
        }

        .toast {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
            border-left: 5px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 14px;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast.hide {
            transform: translateX(120%);
            opacity: 0;
        }

        .toast-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .toast-success .toast-icon { background: #d4edda; color: #155724; }
        .toast-error .toast-icon { background: #f8d7da; color: #721c24; }
        .toast-warning .toast-icon { background: #fff3cd; color: #856404; }
        .toast-info .toast-icon { background: #d1ecf1; color: #0c5460; }

        .toast-success { border-left-color: var(--success); }
        .toast-error { border-left-color: var(--danger); }
        .toast-warning { border-left-color: var(--warning); }
        .toast-info { border-left-color: var(--info); }

        .toast-content { flex: 1; }
        .toast-content .toast-title { font-weight: 600; font-size: 0.95rem; color: var(--dark); margin-bottom: 2px; }
        .toast-content .toast-message { font-size: 0.85rem; color: var(--gray); }

        .toast-close {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 4px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .toast-close:hover { color: #333; }

        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            animation: toastProgress 4s linear forwards;
        }
        .toast-success .toast-progress { background: var(--success); }
        .toast-error .toast-progress { background: var(--danger); }
        .toast-warning .toast-progress { background: var(--warning); }
        .toast-info .toast-progress { background: var(--info); }

        @keyframes toastProgress {
            0% { width: 100%; }
            100% { width: 0%; }
        }

        /* ===== MAIN STYLES ===== */
        * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, sans-serif; }
        body { background:#f5f7fa; }

        /* Page Title */

        .page-title h1 { font-size:2rem; font-weight:700; }
        .page-title .product-count { background:#e6f0fa; padding:0.3rem 1.2rem; border-radius:60px; font-size:0.9rem; color:#1f5680; }

        /* Filter Section */
        .filter-section { background:white; border-radius:16px; padding:1.2rem 1.5rem; display:flex; flex-wrap:wrap; gap:1rem; align-items:center; border:1px solid #eef2f6; margin-bottom:1.5rem; }

        .filter-section .btn-reset:hover { background:#f1f4f8; }
        .price-range { display:flex; align-items:center; gap:0.5rem; }

        /* Product Grid */
        .product-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:1.5rem; }
        .product-card { background:white; border-radius:20px; padding:1.2rem; border:1px solid #eef2f6; transition:0.3s; text-decoration:none; color:inherit; display:block; }
        .product-card:hover { transform:translateY(-6px); box-shadow:0 12px 32px rgba(0,0,0,0.08); border-color:#f8b400; }
        .product-image { background:#f1f4f8; border-radius:16px; height:200px; display:flex; align-items:center; justify-content:center; font-size:3.5rem; color:#2a7de1; margin-bottom:0.8rem; }
        .product-card .badge { position:absolute; top:10px; right:10px; background:#dc3545; color:white; padding:0.2rem 0.8rem; border-radius:30px; font-size:0.7rem; font-weight:600; }
        .product-card .position-relative { position:relative; }
        .product-card h4 { font-size:1rem; font-weight:600; margin-bottom:0.3rem; }
        .product-card .category-tag { font-size:0.75rem; color:#5b768b; background:#f1f4f8; padding:0.1rem 0.6rem; border-radius:30px; display:inline-block; }
        .product-card .price { font-size:1.3rem; font-weight:700; color:#2a7de1; margin:0.3rem 0; }
        .product-card .old-price { font-size:0.9rem; color:#999; text-decoration:line-through; margin-left:0.5rem; }
        .product-card .rating { color:#f8b400; margin:0.2rem 0; }
        .product-card .stock { font-size:0.8rem; color:#28a745; }
        .product-card .out-of-stock { font-size:0.8rem; color:#dc3545; }
        .product-card .add-btn { background:#f1f4f8; border:none; padding:0.5rem 1.2rem; border-radius:30px; font-weight:500; cursor:pointer; transition:0.2s; margin-top:0.5rem; width:100%; }

        /* Footer */
        .footer { background:white; border-radius:20px; padding:2rem; margin-top:2rem; text-align:center; color:#5b768b; border:1px solid #eef2f6; }

        /* Responsive */

    class ToastManager {
        constructor() {
            this.container = null;
            this.init();
        }

        init() {
            if (!document.querySelector('.toast-container')) {
                this.container = document.createElement('div');
                this.container.className = 'toast-container';
                document.body.appendChild(this.container);
            } else {
                this.container = document.querySelector('.toast-container');
            }
        }

        show(message, options) {
            options = options || {};
            var type = options.type || 'info';
            var title = options.title || '';
            var duration = options.duration || 4000;
            var icon = options.icon || null;

            var toast = document.createElement('div');
            toast.className = 'toast toast-' + type;

            var icons = {
                success: 'fa-check-circle',
                error: 'fa-times-circle',
                warning: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };

            var iconClass = icon || icons[type] || icons.info;

            var defaultTitles = {
                success: '✅ Success!',
                error: '❌ Error!',
                warning: '⚠️ Warning!',
                info: 'ℹ️ Info'
            };
            var displayTitle = title || defaultTitles[type] || defaultTitles.info;

            toast.innerHTML = 
                '<div class="toast-icon"><i class="fas ' + iconClass + '"></i></div>' +
                '<div class="toast-content">' +
                    '<div class="toast-title">' + displayTitle + '</div>' +
                    '<div class="toast-message">' + message + '</div>' +
                '</div>' +
                '<button class="toast-close" onclick="this.closest(\'.toast\').remove()">&times;</button>' +
                '<div class="toast-progress"></div>';

            this.container.appendChild(toast);

            setTimeout(function() { toast.classList.add('show'); }, 10);

            var timeout = setTimeout(function() { 
                if (toast.parentNode) {
                    toast.classList.remove('show');
                    toast.classList.add('hide');
                    setTimeout(function() { if (toast.parentNode) toast.remove(); }, 500);
                }
            }, duration);

            toast.addEventListener('click', function(e) {
                if (e.target.closest('.toast-close')) return;
                if (toast.parentNode) {
                    toast.classList.remove('show');
                    toast.classList.add('hide');
                    setTimeout(function() { if (toast.parentNode) toast.remove(); }, 500);
                }
                clearTimeout(timeout);
            });

            return toast;
        }

        success(message, title) { return this.show(message, { type: 'success', title: title || '' }); }
        error(message, title) { return this.show(message, { type: 'error', title: title || '' }); }
        warning(message, title) { return this.show(message, { type: 'warning', title: title || '' }); }
        info(message, title) { return this.show(message, { type: 'info', title: title || '' }); }
    }

    // ============================================================
    // CART FUNCTIONS
    // ============================================================
    function getCart() { 
        return JSON.parse(localStorage.getItem('cart')) || []; 
    }

    function updateCartCount() {
        var cart = getCart();
        var count = 0;
        for (var i = 0; i < cart.length; i++) {
            count += cart[i].quantity;
        }
        document.getElementById('cartCount').textContent = count;
    }

    // ============================================================
    // RENDER PRODUCTS
    // ============================================================
    function renderProducts(filteredProducts) {
        var grid = document.getElementById('productGrid');
        var countDisplay = document.getElementById('productCount');

        if (filteredProducts.length === 0) {
            grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:3rem; color:#5b768b; font-size:1.1rem;"><i class="fas fa-box-open" style="font-size:2rem; display:block; margin-bottom:1rem; color:#dce5ed;"></i>No products found. Try adjusting your filters.</p>';
            countDisplay.textContent = '0 products';
            return;
        }

        countDisplay.textContent = filteredProducts.length + ' products';

        var html = '';
        for (var i = 0; i < filteredProducts.length; i++) {
            var p = filteredProducts[i];
            
            // Stock status
            var stockText = p.stock > 0 ? 
                '<span class="stock"><i class="fas fa-check-circle"></i> In Stock (' + p.stock + ')</span>' : 
                '<span class="out-of-stock"><i class="fas fa-times-circle"></i> Out of Stock</span>';
            
            // Old price
            var oldPrice = p.oldPrice ? '<span class="old-price">$' + p.oldPrice.toFixed(2) + '</span>' : '';
            
            // Rating stars
            var stars = '';
            for (var s = 0; s < Math.floor(p.rating); s++) stars += '★';
            for (var s2 = 0; s2 < 5 - Math.floor(p.rating); s2++) stars += '☆';
            
            // Discount badge
            var discountBadge = '';
            if (p.oldPrice) {
                var discount = Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100);
                discountBadge = '<span class="badge">-' + discount + '%</span>';
            }
            
            html += '<div class="product-card">' +
                '<div class="position-relative">' +
                    '<div class="product-image"><i class="fas ' + p.image + '"></i></div>' +
                    discountBadge +
                '</div>' +
                '<span class="category-tag">' + p.category + '</span>' +
                '<h4>' + p.name + '</h4>' +
                '<div class="rating">' + stars + ' ' + p.rating + '</div>' +
                '<div class="price">$' + p.price.toFixed(2) + ' ' + oldPrice + '</div>' +
                stockText +
                '<button class="add-btn" onclick="addToCart(' + p.id + ')">' +
                '<i class="fas fa-cart-plus"></i> Add to Cart</button>' +
            '</div>';
        }
        grid.innerHTML = html;
    }

    // ============================================================
    // ADD TO CART
    // ============================================================
    window.addToCart = function(productId) {
        // Get fresh product data
        var allProducts = JSON.parse(localStorage.getItem('products')) || products;
        var product = null;
        for (var i = 0; i < allProducts.length; i++) {
            if (allProducts[i].id === productId) {
                product = allProducts[i];
                break;
            }
        }
        
        if (!product) {
            toast.error('Product not found!', 'Error');
            return;
        }
        
        if (product.stock <= 0) {
            toast.error('Sorry, this product is currently out of stock!', 'Out of Stock');
            return;
        }
        
        var cart = getCart();
        var existing = null;
        for (var j = 0; j < cart.length; j++) {
            if (cart[j].id === productId) {
                existing = cart[j];
                break;
            }
        }
        
        if (existing) {
            if (existing.quantity >= product.stock) {
                toast.warning('Not enough stock available! Only ' + product.stock + ' left.', 'Stock Limit');
                return;
            }
            existing.quantity += 1;
        } else {
            var newItem = { 
                id: product.id, 
                name: product.name, 
                price: product.price, 
                image: product.image, 
                quantity: 1 
            };
            cart.push(newItem);
        }
        
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();
        toast.success(product.name + ' added to cart! 🛒', 'Added to Cart');
    };

    function getProducts() {

    window.applyFilters = function() {

        var category = document.getElementById('categoryFilter').value;
        var sort = document.getElementById('sortFilter').value;
        var search = document.getElementById('searchFilter').value.toLowerCase();
        var maxPrice = parseInt(document.getElementById('priceRange').value);
        document.getElementById('priceLabel').textContent = 'Max: $' + maxPrice;

        var filtered = [];
        for (var i = 0; i < allProducts.length; i++) {
            var p = allProducts[i];
            if (category !== 'all' && p.category !== category) continue;
            if (p.price > maxPrice) continue;
            if (search && !p.name.toLowerCase().includes(search) && !p.category.toLowerCase().includes(search)) continue;
            filtered.push(p);
        }

        // Sorting
        if (sort === 'price-low') {
            filtered.sort(function(a, b) { return a.price - b.price; });
        } else if (sort === 'price-high') {
            filtered.sort(function(a, b) { return b.price - a.price; });
        } else if (sort === 'newest') {
            filtered.sort(function(a, b) { return b.id - a.id; });
        } else { // popular
            filtered.sort(function(a, b) { return (b.popular ? 1 : 0) - (a.popular ? 1 : 0); });
        }

        renderProducts(filtered);
    };

    window.resetFilters = function() {
        document.getElementById('categoryFilter').value = 'all';
        document.getElementById('sortFilter').value = 'popular';
        document.getElementById('searchFilter').value = '';
        document.getElementById('priceRange').value = 500;
        document.getElementById('priceLabel').textContent = 'Max: $500';
        applyFilters();
    };

    // ============================================================
    // INITIALIZE
    // ============================================================
    // Check for category parameter from URL
    var urlParams = new URLSearchParams(window.location.search);
    var categoryParam = urlParams.get('category');
    if (categoryParam) {
        document.getElementById('categoryFilter').value = categoryParam;
    }

    applyFilters();
    updateCartCount();
    console.log('✅ Products page loaded successfully!');
    console.log('📦 Total products:', getProducts().length);
</script>
</body>
</html>
