<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - MarketStall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f5f7fa; color: #0b1b2b; padding-bottom: 70px; }
        a { text-decoration: none; color: inherit; }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 16px; }

        /* Toast notifications (same as index) */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 380px; width: 90%; pointer-events: none; }
        .toast { background: #ffffff; border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); border-left: 4px solid #2a7de1; display: flex; align-items: center; gap: 12px; transform: translateX(120%); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: auto; position: relative; overflow: hidden; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.hide { transform: translateX(120%); opacity: 0; }
        .toast-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
        .toast-success .toast-icon { background: #d4edda; color: #155724; }
        .toast-error .toast-icon { background: #f8d7da; color: #721c24; }
        .toast-warning .toast-icon { background: #fff3cd; color: #856404; }
        .toast-info .toast-icon { background: #d1ecf1; color: #0c5460; }
        .toast-success { border-left-color: #28a745; }
        .toast-error { border-left-color: #dc3545; }
        .toast-warning { border-left-color: #ffc107; }
        .toast-info { border-left-color: #17a2b8; }
        .toast-content { flex: 1; }
        .toast-content .toast-title { font-weight: 600; font-size: 0.9rem; color: #0b1b2b; }
        .toast-content .toast-message { font-size: 0.82rem; color: #5b768b; }
        .toast-close { background: none; border: none; color: #999; cursor: pointer; font-size: 1.1rem; padding: 0 4px; }
        .toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; animation: toastProgress 4s linear forwards; }
        .toast-success .toast-progress { background: #28a745; }
        .toast-error .toast-progress { background: #dc3545; }
        .toast-warning .toast-progress { background: #ffc107; }
        .toast-info .toast-progress { background: #17a2b8; }
        @keyframes toastProgress { 0% { width: 100%; } 100% { width: 0%; } }

        /* Header */
        .header { position: sticky; top: 0; z-index: 100; background: #ffffff; padding: 12px 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border-bottom: 1px solid #eef2f6; }
        .header-top { display: flex; align-items: center; gap: 12px; max-width: 1280px; margin: 0 auto; }
        .logo { font-size: 1.3rem; font-weight: 700; color: #0b1b2b; flex-shrink: 0; }
        .logo i { color: #f8b400; }
        .logo span { color: #2a7de1; }
        .search-bar { flex: 1; display: flex; background: #f1f4f8; border-radius: 30px; overflow: hidden; height: 40px; max-width: 500px; }
        .search-bar input { flex: 1; border: none; background: transparent; padding: 0 16px; font-size: 0.85rem; outline: none; }
        .search-bar button { border: none; background: #f8b400; color: #0b1b2b; padding: 0 18px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
        .search-bar button:hover { background: #e0a000; }
        .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .header-actions a { color: #1f3a4b; font-size: 1.1rem; position: relative; padding: 4px 6px; transition: 0.2s; }
        .header-actions a:hover { color: #f8b400; }
        .cart-badge { position: absolute; top: -4px; right: -4px; background: #dc3545; color: #fff; border-radius: 50%; font-size: 0.55rem; font-weight: 700; padding: 1px 5px; min-width: 16px; text-align: center; }
        .btn-signup { background: #f8b400; color: #0b1b2b; padding: 4px 14px; border-radius: 30px; font-size: 0.75rem; font-weight: 600; transition: 0.2s; }
        .btn-signup:hover { background: #e0a000; }
        .btn-logout { background: #dc3545; color: #fff; padding: 4px 14px; border-radius: 30px; border: none; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-logout:hover { background: #c82333; }
        .user-greeting { font-size: 0.75rem; font-weight: 500; color: #1f3a4b; display: flex; align-items: center; gap: 4px; }
        .user-greeting i { color: #f8b400; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; display: flex; justify-content: space-around; align-items: center; padding: 6px 0 10px; box-shadow: 0 -2px 16px rgba(0,0,0,0.06); border-top: 1px solid #eef2f6; z-index: 999; height: 64px; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; color: #868e96; font-size: 0.6rem; font-weight: 500; transition: 0.2s; padding: 2px 8px; position: relative; min-width: 50px; }
        .bottom-nav a i { font-size: 1.2rem; margin-bottom: 2px; }
        .bottom-nav a:hover { color: #f8b400; }
        .bottom-nav a.active { color: #f8b400; }
        .bottom-nav a .nav-badge { position: absolute; top: -4px; right: 2px; background: #dc3545; color: #fff; border-radius: 50%; font-size: 0.5rem; font-weight: 700; padding: 1px 5px; min-width: 16px; text-align: center; }

        /* Page Header */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 12px; flex-wrap: wrap; gap: 8px; }
        .page-header h1 { font-size: 1.2rem; font-weight: 700; }
        .page-header h1 i { color: #f8b400; margin-right: 6px; }

        /* Filters */
        .filter-section { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; background: #ffffff; padding: 12px 16px; border-radius: 12px; border: 1px solid #eef2f6; }
        .filter-section select, .filter-section input { padding: 6px 12px; border: 1px solid #eef2f6; border-radius: 30px; font-size: 0.8rem; background: #f8f9fa; outline: none; flex: 1; min-width: 100px; }
        .filter-section select:focus, .filter-section input:focus { border-color: #f8b400; }
        .filter-section .btn-reset { padding: 6px 16px; border-radius: 30px; border: 1px solid #eef2f6; background: #f8f9fa; cursor: pointer; font-weight: 500; font-size: 0.8rem; transition: 0.2s; }
        .filter-section .btn-reset:hover { background: #f1f4f8; }

        /* Products */
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 8px; }
        .product-card { background: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #eef2f6; transition: 0.2s; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-2px); border-color: #f8b400; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .product-card .badge { position: absolute; top: 8px; right: 8px; background: #dc3545; color: #fff; padding: 2px 10px; border-radius: 30px; font-size: 0.6rem; font-weight: 600; }
        .product-card .position-relative { position: relative; }
        .product-image { background: #f1f4f8; padding: 16px; display: flex; align-items: center; justify-content: center; height: 120px; font-size: 2.2rem; color: #2a7de1; }
        .product-body { padding: 10px 12px 12px; flex: 1; display: flex; flex-direction: column; }
        .product-body .name { font-size: 0.78rem; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 32px; }
        .product-body .price { font-size: 0.9rem; font-weight: 700; color: #2a7de1; margin: 2px 0; }
        .product-body .price .old { font-size: 0.65rem; font-weight: 400; text-decoration: line-through; color: #868e96; margin-left: 4px; }
        .product-body .rating { font-size: 0.65rem; color: #f8b400; margin-bottom: 4px; }
        .product-body .rating .count { color: #868e96; margin-left: 2px; }
        .product-body .stock { font-size: 0.6rem; color: #28a745; margin-bottom: 4px; }
        .product-body .stock.out { color: #dc3545; }
        .btn-add { width: 100%; padding: 6px 0; border: none; border-radius: 30px; font-weight: 600; font-size: 0.7rem; cursor: pointer; transition: 0.2s; background: #f1f4f8; color: #1f3a4b; margin-top: auto; }
        .btn-add:hover { background: #f8b400; color: #0b1b2b; }
        .btn-add i { margin-right: 4px; }

        /* Empty state */
        .empty-state { text-align: center; padding: 40px 20px; background: #ffffff; border-radius: 12px; border: 1px solid #eef2f6; grid-column: 1/-1; }
        .empty-state i { font-size: 3rem; color: #dce5ed; margin-bottom: 12px; display: block; }
        .empty-state h3 { font-size: 1rem; margin-bottom: 4px; }
        .empty-state p { color: #5b768b; font-size: 0.85rem; }

        /* Footer */
        .footer { background: #ffffff; border-radius: 12px; padding: 16px; margin: 8px 0 10px; border: 1px solid #eef2f6; text-align: center; }
        .footer .logo { font-size: 1rem; }
        .footer p { font-size: 0.65rem; color: #5b768b; margin-top: 4px; }
        .footer .links { display: flex; justify-content: center; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
        .footer .links a { color: #2a7de1; font-size: 0.65rem; }

        @media (min-width: 640px) {
            body { padding-bottom: 0; }
            .bottom-nav { display: none; }
            .product-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
            .header { padding: 12px 24px; }
            .logo { font-size: 1.5rem; }
            .search-bar { height: 44px; }
            .search-bar input { font-size: 0.95rem; padding: 0 20px; }
            .search-bar button { padding: 0 24px; font-size: 0.95rem; }
            .product-image { height: 160px; font-size: 2.8rem; }
            .page-header h1 { font-size: 1.4rem; }
            .filter-section { gap: 12px; }
        }
        @media (min-width: 1024px) {
            .product-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
            .product-image { height: 200px; font-size: 3.2rem; }
            .container { padding: 0 24px; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-top">
            <a href="index.html" class="logo"><i class="fas fa-store-alt"></i> Market<span>Stall</span></a>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search products...">
                <button onclick="searchProducts()"><i class="fas fa-search"></i></button>
            </div>
            <div class="header-actions">
                <a href="wishlist.html"><i class="fas fa-heart"></i></a>
                <a href="cart.html"><i class="fas fa-shopping-cart"></i> <span class="cart-badge" id="cartCount">0</span></a>
                <span id="authButtons"></span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-th-list"></i> All Products</h1>
            <span id="productCount" style="font-size:0.85rem; color:#5b768b;">0 products</span>
        </div>

        <div class="filter-section">
            <select id="categoryFilter" onchange="applyFilters()">
                <option value="all">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Home">Home & Living</option>
                <option value="Beauty">Beauty</option>
                <option value="Sports">Sports</option>
                <option value="Books">Books</option>
            </select>
            <select id="sortFilter" onchange="applyFilters()">
                <option value="popular">Most Popular</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
            </select>
            <button onclick="resetFilters()" class="btn-reset">Reset</button>
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Injected by JS -->
        </div>

        <footer class="footer">
            <a href="index.html" class="logo"><i class="fas fa-store-alt"></i> Market<span>Stall</span></a>
            <p>&copy; 2026 MarketStall Investments.</p>
            <div class="links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="transactions.html">Orders</a>
            </div>
        </footer>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="products.html" class="active"><i class="fas fa-th-list"></i><span>Products</span></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i><span>Cart</span><span class="nav-badge" id="bottomCartBadge">0</span></a>
        <a href="transactions.html"><i class="fas fa-receipt"></i><span>Orders</span></a>
        <a href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

    <script>
        // Toast system (same as index)
        class ToastManager {
            constructor() {
                this.container = null;
                this.init();
            }
            init() {
                if (!document.querySelector('.toast-container')) {
                    this.container = document.createElement('div');
                    this.container.className = 'toast-container';
                    document.body.appendChild(this.container);
                } else {
                    this.container = document.querySelector('.toast-container');
                }
            }
            show(message, options) {
                options = options || {};
                var type = options.type || 'info';
                var title = options.title || '';
                var duration = options.duration || 3000;
                var toast = document.createElement('div');
                toast.className = 'toast toast-' + type;
                var icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-circle', info: 'fa-info-circle' };
                var defaultTitles = { success: 'Success', error: 'Error', warning: 'Warning', info: 'Info' };
                var displayTitle = title || defaultTitles[type] || defaultTitles.info;
                toast.innerHTML =
                    '<div class="toast-icon"><i class="fas ' + icons[type] + '"></i></div>' +
                    '<div class="toast-content"><div class="toast-title">' + displayTitle + '</div><div class="toast-message">' + message + '</div></div>' +
                    '<button class="toast-close" onclick="this.closest(\'.toast\').remove()">&times;</button>' +
                    '<div class="toast-progress"></div>';
                this.container.appendChild(toast);
                setTimeout(function() { toast.classList.add('show'); }, 10);
                var timeout = setTimeout(function() {
                    if (toast.parentNode) {
                        toast.classList.remove('show');
                        toast.classList.add('hide');
                        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 400);
                    }
                }, duration);
                toast.addEventListener('click', function(e) {
                    if (e.target.closest('.toast-close')) return;
                    if (toast.parentNode) {
                        toast.classList.remove('show');
                        toast.classList.add('hide');
                        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 400);
                    }
                    clearTimeout(timeout);
                });
                return toast;
            }
            success(message, title) { return this.show(message, { type: 'success', title: title || '' }); }
            error(message, title) { return this.show(message, { type: 'error', title: title || '' }); }
            warning(message, title) { return this.show(message, { type: 'warning', title: title || '' }); }
            info(message, title) { return this.show(message, { type: 'info', title: title || '' }); }
        }
        window.toast = new ToastManager();

        // Auth
        function updateAuthButtons() {
            var authContainer = document.getElementById('authButtons');
            var currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser) {
                authContainer.innerHTML =
                    '<span class="user-greeting"><i class="fas fa-user-circle"></i></span>' +
                    '<button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>';
            } else {
                authContainer.innerHTML = '<a href="signup.html" class="btn-signup"><i class="fas fa-user-plus"></i> Sign Up</a>';
            }
        }
        window.logout = function() {
            if (confirm('Logout?')) {
                localStorage.removeItem('currentUser');
                updateAuthButtons();
                toast.success('Logged out.', 'Goodbye');
                setTimeout(function() { location.reload(); }, 500);
            }
        };

        // Cart
        function getCart() { return JSON.parse(localStorage.getItem('cart')) || []; }
        function updateCartCount() {
            var cart = getCart();
            var count = 0;
            for (var i = 0; i < cart.length; i++) { count += cart[i].quantity; }
            var badge = document.getElementById('cartCount');
            if (badge) badge.textContent = count;
            var bottomBadge = document.getElementById('bottomCartBadge');
            if (bottomBadge) bottomBadge.textContent = count;
        }

        // Products
        var products = JSON.parse(localStorage.getItem('products')) || [];

        function renderProducts(filteredProducts) {
            var grid = document.getElementById('productGrid');
            var countDisplay = document.getElementById('productCount');

            if (filteredProducts.length === 0) {
                grid.innerHTML = '<div class="empty-state"><i class="fas fa-box-open"></i><h3>No products found</h3><p>Try adjusting your filters.</p></div>';
                countDisplay.textContent = '0 products';
                return;
            }

            countDisplay.textContent = filteredProducts.length + ' products';

            var html = '';
            for (var i = 0; i < filteredProducts.length; i++) {
                var p = filteredProducts[i];
                var oldPrice = p.oldPrice ? '<span class="old">$' + p.oldPrice.toFixed(2) + '</span>' : '';
                var stockText = p.stock > 0 ? 'In Stock' : 'Out of Stock';
                var stockClass = p.stock > 0 ? '' : 'out';
                var stars = '';
                for (var s = 0; s < Math.floor(p.rating); s++) stars += '<i class="fas fa-star"></i>';
                if (p.rating - Math.floor(p.rating) >= 0.5) stars += '<i class="fas fa-star-half-alt"></i>';
                for (var e = 0; e < 5 - Math.ceil(p.rating); e++) stars += '<i class="far fa-star"></i>';

                var discountBadge = '';
                if (p.oldPrice) {
                    var discount = Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100);
                    discountBadge = '<span class="badge">-' + discount + '%</span>';
                }

                html += '<div class="product-card"><div class="position-relative"><div class="product-image"><i class="fas ' + p.image + '"></i></div>' + discountBadge + '</div>' +
                    '<div class="product-body"><div class="name">' + p.name + '</div>' +
                    '<div class="price">$' + p.price.toFixed(2) + ' ' + oldPrice + '</div>' +
                    '<div class="rating">' + stars + ' <span class="count">(' + p.rating + ')</span></div>' +
                    '<div class="stock ' + stockClass + '"><i class="fas ' + (p.stock > 0 ? 'fa-check-circle' : 'fa-times-circle') + '"></i> ' + stockText + '</div>' +
                    '<button class="btn-add" onclick="addToCart(' + p.id + ')"><i class="fas fa-cart-plus"></i> Add</button></div></div>';
            }
            grid.innerHTML = html;
        }

        window.addToCart = function(productId) {
            var allProducts = JSON.parse(localStorage.getItem('products')) || products;
            var product = null;
            for (var i = 0; i < allProducts.length; i++) {
                if (allProducts[i].id === productId) { product = allProducts[i]; break; }
            }
            if (!product || product.stock <= 0) {
                toast.error('Out of stock.', 'Error');
                return;
            }
            var cart = getCart();
            var existing = null;
            for (var j = 0; j < cart.length; j++) {
                if (cart[j].id === productId) { existing = cart[j]; break; }
            }
            if (existing) {
                if (existing.quantity >= product.stock) {
                    toast.warning('Stock limit reached.', 'Warning');
                    return;
                }
                existing.quantity += 1;
            } else {
                cart.push({ id: product.id, name: product.name, price: product.price, image: product.image, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            toast.success('Added to cart!', 'Added');
        };

        window.applyFilters = function() {
            var allProducts = JSON.parse(localStorage.getItem('products')) || products;
            var category = document.getElementById('categoryFilter').value;
            var sort = document.getElementById('sortFilter').value;

            var filtered = [];
            for (var i = 0; i < allProducts.length; i++) {
                var p = allProducts[i];
                if (category !== 'all' && p.category !== category) continue;
                filtered.push(p);
            }

            if (sort === 'price-low') {
                filtered.sort(function(a, b) { return a.price - b.price; });
            } else if (sort === 'price-high') {
                filtered.sort(function(a, b) { return b.price - a.price; });
            } else {
                filtered.sort(function(a, b) { return (b.bestseller ? 1 : 0) - (a.bestseller ? 1 : 0); });
            }

            renderProducts(filtered);
        };

        window.resetFilters = function() {
            document.getElementById('categoryFilter').value = 'all';
            document.getElementById('sortFilter').value = 'popular';
            applyFilters();
        };

        window.searchProducts = function() {
            var query = document.getElementById('searchInput').value.trim();
            if (query === '') { toast.info('Enter a search term.', 'Search'); return; }
            window.location.href = 'products.html?search=' + encodeURIComponent(query);
        };
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchProducts();
        });

        // INIT
        document.addEventListener('DOMContentLoaded', function() {
            // Check URL params
            var urlParams = new URLSearchParams(window.location.search);
            var categoryParam = urlParams.get('category');
            var searchParam = urlParams.get('search');

            if (categoryParam) {
                document.getElementById('categoryFilter').value = categoryParam;
            }
            if (searchParam) {
                document.getElementById('searchInput').value = searchParam;
                // Filter by search
                var allProducts = JSON.parse(localStorage.getItem('products')) || products;
                var filtered = allProducts.filter(function(p) {
                    return p.name.toLowerCase().includes(searchParam.toLowerCase()) ||
                        p.category.toLowerCase().includes(searchParam.toLowerCase());
                });
                renderProducts(filtered);
                // Update count
                document.getElementById('productCount').textContent = filtered.length + ' products';
            } else {
                applyFilters();
            }

            updateCartCount();
            updateAuthButtons();
            console.log('Products page loaded!');
        });
    </script>
</body>
</html>
